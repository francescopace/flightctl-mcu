# Apply with tools/fleet/apply.sh tools/fleet/idf-lab.yaml, which fills
# in ${REGISTRY}. The lab's boards pull from the registry's door with TLS:
#   REGISTRY=$(cat .secrets/registry/host) tools/fleet/apply.sh tools/fleet/idf-lab.yaml
# Firmware older than v3.1 has no TLS for the registry (docs/REGISTRY.md).
# Example fleet: the boards with the ESP-IDF firmware, running the "line
# temperature alarm" app. (The ones with the Zephyr build are in
# zephyr-lab.yaml: the two are released apart for now.)
# Change threshold_c and re-apply: devices pick it up on the next long-poll,
# without reboot. The app's fields: threshold_c, hysteresis_c, sample_ms.
# Per-device LED, led0 in /etc/fc/board.json: label the device led-gpio=<n>
# (default -1: the board's) and led-order=<grb|rgb|...> (WS2812 colour byte
# order, default grb); for a plain single-colour LED: led-ws2812=false,
# led-active-low=true|false.
apiVersion: flightctl.io/v1beta1
kind: Fleet
metadata:
  name: idf-lab
spec:
  selector:
    # Flight Control fleets select on matchLabels only (matchExpressions
    # is accepted but ignored). The firmware requests app=alarm at enrollment.
    matchLabels:
      app: alarm
  # Firmware and config changes go to the canary first, then to the rest of
  # the fleet only if every canary device updated successfully.
  rolloutPolicy:
    deviceSelection:
      strategy: BatchSequence
      sequence:
        - selector:
            matchLabels:
              stage: canary
          limit: 1
    successThreshold: 100%
  template:
    metadata:
      labels:
        fleet: idf-lab
    spec:
      # Multi-chip OCI index (tools/fw-push.py): each device picks its chip.
      os:
        image: ${REGISTRY}/flightctl-mcu/fw:v3.3
      # The alarm as a WASM app (wasm-apps/alarm): replaced without reboot.
      applications:
        - name: alarm
          appType: container
          image: ${REGISTRY}/flightctl-mcu/alarm:v2.3
          envVars:
            FC_ALLOW: "led0"
      config:
        - name: board
          inline:
            - path: /etc/fc/board.json
              content: '{"led": {"led0": {"pin": {{ getOrDefault .metadata.labels "led-gpio" "-1" }}, "order": "{{ getOrDefault .metadata.labels "led-order" "grb" }}", "ws2812": {{ getOrDefault .metadata.labels "led-ws2812" "true" }}, "active_low": {{ getOrDefault .metadata.labels "led-active-low" "false" }}}}}'
        - name: alarm
          inline:
            - path: /etc/fc-app/alarm.json
              content: '{"threshold_c": 40, "hysteresis_c": 1, "sample_ms": 2000}'
