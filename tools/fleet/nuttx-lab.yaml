# Apply with tools/fleet/apply.sh tools/fleet/nuttx-lab.yaml.
apiVersion: flightctl.io/v1beta1
kind: Fleet
metadata:
  name: nuttx-lab
spec:
  selector:
    matchLabels:
      app: nuttx-lab
      os: nuttx
  template:
    metadata:
      labels:
        fleet: nuttx-lab
    spec:
      os:
        image: ${REGISTRY}/flightctl-mcu/fw:v0.9.7
      applications:
        - name: alarm
          appType: container
          image: ${REGISTRY}/flightctl-mcu/alarm:v0.9.7
      config:
        - name: alarm
          inline:
            - path: /etc/fc-app/alarm.json
              content: '{"threshold_c": 50, "hysteresis_c": 1, "sample_ms": 2000}'
