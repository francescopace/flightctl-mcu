# Apply with tools/fleet/apply.sh tools/fleet/zephyr-lab.yaml, which fills
# in ${REGISTRY}. The lab's boards pull from the registry's door with TLS:
#   REGISTRY=$(cat .secrets/registry/host) tools/fleet/apply.sh tools/fleet/zephyr-lab.yaml
# Without REGISTRY the fleet points at the plain door, and every board
# downloads its firmware again (docs/REGISTRY.md).
# Example fleet: the boards with the Zephyr build (docs/ZEPHYR.md), whatever
# the board. A device joins with the label app=zephyr-lab, given when it is
# provisioned (--labels) or approved. (The boards with the ESP-IDF firmware
# are in idf-lab.yaml: the two are released apart for now.)
apiVersion: flightctl.io/v1beta1
kind: Fleet
metadata:
  name: zephyr-lab
spec:
  selector:
    matchLabels:
      app: zephyr-lab
  template:
    metadata:
      labels:
        fleet: zephyr-lab
    spec:
      # One OCI index with an image per board (tools/fw-push.py
      # PLATFORM=zephyr.signed.bin ...): each device takes its own.
      os:
        # z16 by its digest: the Pico W rolled back its first try of fw:z16
        # (its WiFi chip went silent in the trial boot) and the agent does not
        # try a rolled-back reference again.
        image: ${REGISTRY}/flightctl-mcu/fw@sha256:ed46221fe85c459dedd5696a98c417c16ff351b51fd7fa63d8714da394129359
      # The same WASM app as on the ESP-IDF boards; here its temperature and
      # its LED are simulated (port/zephyr/src/main.c).
      applications:
        - name: alarm
          appType: container
          image: ${REGISTRY}/flightctl-mcu/alarm:v2.3
          envVars:
            FC_ALLOW: "led0"
      config:
        - name: alarm
          inline:
            - path: /etc/fc-app/alarm.json
              content: '{"threshold_c": 40}'
