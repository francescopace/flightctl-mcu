apiVersion: flightctl.io/v1alpha1
kind: Catalog
metadata:
  name: mcu-lab
spec:
  displayName: MCU lab (test)
  shortDescription: Firmware and WASM apps for the flightctl-mcu boards
---
apiVersion: flightctl.io/v1alpha1
kind: CatalogItem
metadata:
  name: alarm
  catalog: mcu-lab
spec:
  displayName: Line temperature alarm (WASM)
  category: application
  type: container
  artifacts:
  - type: container
    uri: ${HOST_IP}:5001/flightctl-mcu/alarm
  versions:
  - version: 2.0.1-pico
    channels:
    - candidate
    references:
      container: v2.pico
  - version: 2.2.0
    channels:
    - stable
    references:
      container: v2.2
---
apiVersion: flightctl.io/v1alpha1
kind: CatalogItem
metadata:
  name: arduino
  catalog: mcu-lab
spec:
  displayName: Arduino LED blink (WASM)
  shortDescription: Blinks the board LED using the Rust build. Set FC_ALLOW=led0 when deploying.
  category: application
  type: container
  artifacts:
  - type: container
    uri: ${HOST_IP}:5001/flightctl-mcu/arduino
  versions:
  - version: 1.0.0
    channels:
    - stable
    references:
      container: rust
---
apiVersion: flightctl.io/v1alpha1
kind: CatalogItem
metadata:
  name: coremark
  catalog: mcu-lab
spec:
  displayName: CoreMark benchmark (WASM)
  shortDescription: Measures iterations per second using the wasm3 build. Set FC_ENTRY=run when deploying.
  category: application
