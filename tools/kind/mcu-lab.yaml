apiVersion: flightctl.io/v1alpha1
kind: Catalog
metadata:
  name: mcu-lab
spec:
  displayName: MCU lab (test)
  shortDescription: Firmware and WASM apps for the flightctl-mcu boards
---
apiVersion: flightctl.io/v1alpha1
kind: CatalogItem
metadata:
  name: alarm
  catalog: mcu-lab
spec:
  displayName: Line temperature alarm (WASM)
  category: application
  type: container
  artifacts:
  - type: container
    uri: registry.${HOST_IP}.nip.io:5443/flightctl-mcu/alarm
  versions:
  - version: 2.2.0
    channels:
    - stable
    references:
      container: v2.2
  - version: 2.4.0
    channels:
    - stable
    references:
      container: v2.4.0
---
apiVersion: flightctl.io/v1alpha1
kind: CatalogItem
metadata:
  name: arduino
  catalog: mcu-lab
spec:
  displayName: Arduino LED blink (WASM)
  shortDescription: Blinks the board LED using the Rust build by default. Set FC_ALLOW=led0 when deploying.
  category: application
  type: container
  artifacts:
  - type: container
    uri: registry.${HOST_IP}.nip.io:5443/flightctl-mcu/arduino
  versions:
  - version: 1.0.0
    channels:
    - stable
    references:
      container: rust
  - version: 1.1.0
    channels:
    - stable
    references:
      container: v1.1.0-rust
  - version: 1.1.0-cpp
    channels:
    - cpp
    references:
      container: v1.1.0-cpp
  - version: 1.1.0-assemblyscript
    channels:
    - assemblyscript
    references:
      container: v1.1.0-assemblyscript
  - version: 1.1.0-tinygo
    channels:
    - tinygo
    references:
      container: v1.1.0-tinygo
---
apiVersion: flightctl.io/v1alpha1
kind: CatalogItem
metadata:
  name: coremark
  catalog: mcu-lab
spec:
  displayName: CoreMark benchmark (WASM)
  shortDescription: Measures iterations per second with 64 KiB (stable) or 128 KiB (large-memory). Set FC_ENTRY=run when deploying.
  category: application
  type: container
  artifacts:
  - type: container
    uri: registry.${HOST_IP}.nip.io:5443/flightctl-mcu/coremark
  versions:
  - version: 1.0.0
    channels:
    - stable
    references:
      container: wasm3
  - version: 1.1.0
    channels:
    - stable
    references:
      container: v1.1.0-wasm3
  - version: 1.1.0-128k
    channels:
    - large-memory
    references:
      container: v1.1.0-wasm-coremark
---
