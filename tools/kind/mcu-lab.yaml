apiVersion: flightctl.io/v1alpha1
kind: Catalog
metadata:
  name: mcu-lab
spec:
  displayName: MCU lab (test)
  shortDescription: Firmware and WASM apps for the flightctl-mcu boards
---
apiVersion: flightctl.io/v1alpha1
kind: CatalogItem
metadata:
  name: alarm
  catalog: mcu-lab
spec:
  displayName: Line temperature alarm (WASM)
  category: application
  type: container
  artifacts:
  - type: container
    uri: registry.${HOST_IP}.nip.io:5443/flightctl-mcu/alarm
  versions:
  - version: 0.9.3
    channels:
    - stable
    references:
      container: v0.9.3
---
apiVersion: flightctl.io/v1alpha1
kind: CatalogItem
metadata:
  name: arduino
  catalog: mcu-lab
spec:
  displayName: Arduino LED blink (WASM)
  shortDescription: Blinks the board LED using the Rust build by default. Set FC_ALLOW=led0 when deploying.
  category: application
  type: container
  artifacts:
  - type: container
    uri: registry.${HOST_IP}.nip.io:5443/flightctl-mcu/arduino
  versions:
  - version: 0.9.3
    channels:
    - stable
    references:
      container: v0.9.3-rust
  - version: 0.9.3-cpp
    channels:
    - cpp
    references:
      container: v0.9.3-cpp
  - version: 0.9.3-assemblyscript
    channels:
    - assemblyscript
    references:
      container: v0.9.3-assemblyscript
  - version: 0.9.3-tinygo
    channels:
    - tinygo
    references:
      container: v0.9.3-tinygo
---
apiVersion: flightctl.io/v1alpha1
kind: CatalogItem
metadata:
  name: battery
  catalog: mcu-lab
spec:
  displayName: Battery telemetry (WASM)
  shortDescription: Reports pack voltage, low voltage, charge percentage and charging state. Grant the configured sensor names and metrics.
  category: application
  type: container
  artifacts:
  - type: container
    uri: registry.${HOST_IP}.nip.io:5443/flightctl-mcu/battery
  versions:
  - version: 0.9.3
    channels:
    - stable
    references:
      container: v0.9.3
---
apiVersion: flightctl.io/v1alpha1
kind: CatalogItem
metadata:
  name: coremark
  catalog: mcu-lab
spec:
  displayName: CoreMark benchmark (WASM)
  shortDescription: Measures iterations per second with 64 KiB (stable) or 128 KiB (large-memory). Set FC_ENTRY=run when deploying.
  category: application
  type: container
  artifacts:
  - type: container
    uri: registry.${HOST_IP}.nip.io:5443/flightctl-mcu/coremark
  versions:
  - version: 0.9.3
    channels:
    - stable
    references:
      container: v0.9.3-wasm3
  - version: 0.9.3-128k
    channels:
    - large-memory
    references:
      container: v0.9.3-wasm-coremark
---
