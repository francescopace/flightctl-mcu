apiVersion: flightctl.io/v1alpha1
kind: CatalogItem
metadata:
  name: fw-espidf-lab
  catalog: mcu-lab
spec:
  displayName: ESP-IDF firmware for ESP32 boards
  shortDescription: Runs the Flight Control agent on ESP32, C3, C5, C6 and S3 boards in the ESP-IDF lab fleet.
  provider: flightctl-mcu
  support: https://github.com/francescopace/flightctl-mcu/issues
  homepage: https://github.com/francescopace/flightctl-mcu
  documentationUrl: https://github.com/francescopace/flightctl-mcu/blob/main/docs/QUICKSTART.md#6-give-it-firmware-config-and-an-app
  category: system
  type: os
  artifacts:
  - type: container
    uri: registry.${HOST_IP}.nip.io:5443/flightctl-mcu/fw
  versions:
  - version: 0.9.7
    replaces: 0.9.5
    readme: |
      Select this release for the `idf-lab` fleet. The index has images for ESP32, C3, C5, C6, S3 and S3 with octal PSRAM (`esp32s3-r8`). The ESP-IDF, Zephyr and NuttX entries share a firmware index. Each device selects the image for its platform.
    channels:
    - stable
    references:
      container: v0.9.7
  - version: 0.9.5
    readme: |
      Select this entry for the `idf-lab` fleet. The ESP-IDF, Zephyr and NuttX entries share a firmware index. Each device selects the image for its platform.
    channels:
    - stable
    references:
      container: v0.9.5
---
apiVersion: flightctl.io/v1alpha1
kind: CatalogItem
metadata:
  name: fw-zephyr-lab
  catalog: mcu-lab
spec:
  displayName: Zephyr firmware for Espressif boards, Pico 2 W, nRF7002-DK and NUCLEO-F767ZI
  shortDescription: MCUboot firmware updates over Wi-Fi on ESP32-S3, Pico 2 W and nRF7002-DK, and over onboard Ethernet or the ST-LINK USB bridge on NUCLEO-F767ZI.
  provider: flightctl-mcu
  support: https://github.com/francescopace/flightctl-mcu/issues
  homepage: https://github.com/francescopace/flightctl-mcu
  documentationUrl: https://github.com/francescopace/flightctl-mcu/blob/main/docs/ZEPHYR.md
  category: system
  type: os
  artifacts:
  - type: container
    uri: registry.${HOST_IP}.nip.io:5443/flightctl-mcu/fw
  versions:
  - version: 0.9.7
    replaces: 0.9.6
    readme: |
      Select this release for the `zephyr-lab` fleet. The index has images for the ESP32-S3 DevKitC and S3 Mini, ESP32, C3, C5 Mini, C6, Pico 2 W, nRF7002-DK and both Nucleo links (`nucleo_f767zi` for onboard Ethernet, `nucleo_f767zi-stlink` for the USB network bridge). Devices report the firmware version in `customInfo.firmwareVersion`. The ESP32-S3 DevKitC image uses GPIO38 for the RGB LED.
    channels:
    - stable
    references:
      container: v0.9.7
  - version: 0.9.6
    replaces: 0.9.5
    readme: |
      Select this release for the `zephyr-lab` fleet. The Nucleo uses `nucleo_f767zi` for onboard Ethernet or `nucleo_f767zi-stlink` for the USB network bridge. The ESP32-S3 DevKitC image uses GPIO38 for the RGB LED.
    channels:
    - stable
    references:
      container: v0.9.6
  - version: 0.9.5
    readme: |
      Select this entry for the `zephyr-lab` fleet. The shared index contains `esp32s3_devkitc` for the DevKitC, `rpi_pico2_rp2350a_m33_0_w` for the Pico 2 W and `nrf7002dk_nrf5340_cpuapp` for the Nordic DK.
    channels:
    - stable
    references:
      container: v0.9.5
---
apiVersion: flightctl.io/v1alpha1
kind: CatalogItem
metadata:
  name: fw-nuttx-lab
  catalog: mcu-lab
spec:
  displayName: NuttX firmware for ESP32-S3, Pico 2 W, nRF7002-DK and NUCLEO-F767ZI
  shortDescription: Runs the Flight Control agent on NuttX boards provisioned with MCUboot. ESP32-S3 modules, Pico 2 W, nRF7002-DK and NUCLEO-F767ZI.
  provider: flightctl-mcu
  support: https://github.com/francescopace/flightctl-mcu/issues
  homepage: https://github.com/francescopace/flightctl-mcu
  documentationUrl: https://github.com/francescopace/flightctl-mcu/blob/main/docs/NUTTX.md#firmware-ota-with-mcuboot
  category: system
  type: os
  artifacts:
  - type: container
    uri: registry.${HOST_IP}.nip.io:5443/flightctl-mcu/fw
  versions:
  - version: 0.9.7
    replaces: 0.9.6
    readme: |
      Select this release for the `nuttx-lab` fleet. The index has images for the ESP32-S3 N4R2, N8R8 and N16R8, the Pico 2 W, the nRF7002-DK and both Nucleo links. ESP32, C3, C5 and C6 use Simple Boot and are installed over USB.
    channels:
    - stable
    references:
      container: v0.9.7
  - version: 0.9.6
    replaces: 0.9.5
    readme: |
      Adds GPIO interrupts, RGB LEDs, I²C, SPI, UART, ADC, PWM, temperature notifications and crash diagnostics on the N4R2, N8R8 and N16R8. Configure the app wiring in /etc/fc/board.json.
    channels:
    - stable
    references:
      container: v0.9.6
  - version: 0.9.5
    readme: |
      Select this entry for the `nuttx-lab` fleet. The device selects the OTA image for its N4R2, N8R8 or N16R8 module.
    channels:
    - stable
    references:
      container: v0.9.5
---
