kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  extraPortMappings:
  # Envoy Gateway NodePorts (vedi docs Flight Control "Installing a kind cluster").
  # listenAddress 0.0.0.0 rende le porte raggiungibili dagli ESP32 in LAN.
  - containerPort: 30080
    hostPort: 8080
    listenAddress: "0.0.0.0"
    protocol: TCP
  - containerPort: 30443
    hostPort: 8443
    listenAddress: "0.0.0.0"
    protocol: TCP
