# Apply with deploy/fleet/apply.sh, which fills in ${REGISTRY}.
# PoC fleet: every MCU with the "line temperature alarm" app (S3, C3, C5, C6).
# Change threshold_c and re-apply: devices pick it up on the next long-poll,
# without reboot. Fields: threshold_c, hysteresis_c, sample_ms, led_gpio, led_ws2812.
# Per-device LED: label the device led-gpio=<n> (default -1 = board default)
# and led-order=<grb|rgb|...> (WS2812 colour byte order, default grb);
# for a plain single-colour LED: led-ws2812=false, led-active-low=true|false.
apiVersion: flightctl.io/v1beta1
kind: Fleet
metadata:
  name: alarm-lab
spec:
  selector:
    # Flight Control 1.3 fleets select on matchLabels only (matchExpressions
    # is accepted but ignored). The firmware requests app=alarm at enrollment.
    matchLabels:
      app: alarm
  # Firmware and config changes go to the canary first, then to the rest of
  # the fleet only if every canary device updated successfully.
  rolloutPolicy:
    deviceSelection:
      strategy: BatchSequence
      sequence:
        - selector:
            matchLabels:
              stage: canary
          limit: 1
    successThreshold: 100%
  template:
    metadata:
      labels:
        fleet: alarm-lab
    spec:
      # Multi-chip OCI index (firmware/fw-push.py): each device picks its chip.
      os:
        image: ${REGISTRY}/flightctl-mcu/fw:v2.7
      # LED logic as a WASM app (wasm-apps/alarm): replaced without reboot.
      applications:
        - name: alarm
          appType: container
          image: ${REGISTRY}/flightctl-mcu/alarm:v2.2
          envVars:
            TICK_MS: "100"
      config:
        - name: alarm
          inline:
            - path: /etc/fc-app/alarm.json
              content: '{"threshold_c": 40, "hysteresis_c": 1, "sample_ms": 2000, "led_gpio": {{ getOrDefault .metadata.labels "led-gpio" "-1" }}, "led_order": "{{ getOrDefault .metadata.labels "led-order" "grb" }}", "led_ws2812": {{ getOrDefault .metadata.labels "led-ws2812" "true" }}, "led_active_low": {{ getOrDefault .metadata.labels "led-active-low" "false" }}}'
