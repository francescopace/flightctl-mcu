name: mbedTLS
description: mbedTLS built from source once per version, then restored from the cache
outputs:
  dir:
    description: CMake package directory (MbedTLS_DIR)
    value: /tmp/mbedtls-install/lib/cmake/MbedTLS
runs:
  using: composite
  steps:
    - uses: actions/cache@v6
      id: cache
      with:
        path: /tmp/mbedtls-install
        key: mbedtls-${{ hashFiles('third_party/build-mbedtls-host.sh') }}-${{ runner.os }}-${{ runner.arch }}
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: third_party/build-mbedtls-host.sh /tmp/mbedtls-install
