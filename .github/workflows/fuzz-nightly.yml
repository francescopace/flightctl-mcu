name: fuzz-nightly

# Long fuzzing runs. The corpus (inputs that reached new code) is kept in the
# Actions cache from one night to the next, so each run starts where the last
# one stopped; the quick pass in ci.yml starts from it too.

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: minutes per target
        default: "20"

env:
  MBEDTLS_VERSION: v4.1.1

jobs:
  fuzz:
    name: fuzzing, ${{ inputs.minutes || '20' }} minutes per target
    runs-on: ubuntu-latest
    # Zephyr's build image has clang and ninja: nothing to install (ci.yml).
    container: ghcr.io/zephyrproject-rtos/ci-base:v0.29.1
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory '*'
      - name: clang on the PATH
        run: echo "$(dirname "$(ls /usr/lib/llvm-*/bin/clang | tail -1)")" >> "$GITHUB_PATH"
      - uses: ./.github/actions/mbedtls
        id: mbedtls
        with:
          version: ${{ env.MBEDTLS_VERSION }}
      - uses: actions/cache/restore@v4
        with:
          path: build/fuzz/corpus_*
          key: fuzz-corpus-
          restore-keys: fuzz-corpus-
      - name: fuzz
        run: |
          third_party/fetch-wamr.sh
          third_party/fetch-detools.sh
          FUZZ_SECONDS=$(( ${{ inputs.minutes || '20' }} * 60 )) CC=clang ci/fuzz.sh \
            -DMbedTLS_DIR=${{ steps.mbedtls.outputs.dir }}
      - name: corpus size
        if: always()
        run: |
          for d in build/fuzz/corpus_*; do echo "$d: $(ls "$d" | wc -l) inputs"; done
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: build/fuzz/corpus_*
          key: fuzz-corpus-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-findings
          path: build/fuzz/crash-*
