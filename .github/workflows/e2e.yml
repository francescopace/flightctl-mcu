name: e2e

# The end-to-end tests against Flight Control on kind, on what a CI run built
# (ci.yml). Only the broken firmware for the rollback test is built here, as
# nothing else uses it. The secure images come unsigned: the test signs them
# with throwaway Secure Boot keys.
# Three ways in:
#   - nightly, on the last successful CI run of main, unless that commit has
#     passed here already;
#   - by hand: Actions > e2e > Run workflow, optionally with a CI run's id;
#   - from a CI run, by re-running its skipped "e2e" job (ci.yml).
# The certificate waits are all in: the host and Zephyr runs wait for a
# certificate to expire, the plain C5 renews 2-minute certificates.

on:
  schedule:
    - cron: "17 3 * * *"   # an hour after fuzz-nightly
  workflow_dispatch:
    inputs:
      run-id:
        description: successful CI run on main to test (default the latest successful push)
        required: false
        default: ""
  workflow_call:
    inputs:
      run-id:
        description: id of the CI run whose builds to test
        type: string
        required: true

permissions:
  contents: read
  actions: read

# Jobs that check out or execute a CI build can restore compiler caches.
# Only the separate job recording a successful run needs to save anything.
cache-mode: read

env:
  FLIGHTCTL_VERSION: v1.4.0
  ESP_EMU_VERSION: 1.1.0

jobs:
  source:
    name: the CI run to test
    runs-on: ubuntu-latest
    outputs:
      run-id: ${{ steps.pick.outputs.run-id }}
      verified_revision: ${{ steps.pick.outputs.verified_revision }}
      skip: ${{ steps.done.outputs.cache-hit == 'true' }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run-id }}
        run: |
          if [[ -z "$RUN_ID" ]]; then
            RUN_ID=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push \
              --status success --limit 1 --json databaseId -q '.[0].databaseId')
            [[ -n "$RUN_ID" ]] || { echo "no successful CI run on main"; exit 1; }
          fi
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "invalid CI run id"; exit 1; }
          if [[ "$RUN_ID" == "$GITHUB_RUN_ID" && "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/ci.yml@"* ]]; then
            # Called by ci.yml. On a PR, CI built the merge commit.
            revision=$GITHUB_SHA
          else
            # An independently selected run must come from this repo's main,
            # including its artifacts. A fork can also name its branch main.
            candidate=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" |
              jq -er --arg repo "$GITHUB_REPOSITORY" '
                select(.path == ".github/workflows/ci.yml" and
                       .head_repository.full_name == $repo and .head_branch == "main" and
                       (.event == "push" or .event == "workflow_dispatch") and .conclusion == "success")
                | .head_sha | select(test("^[0-9a-f]{40}$"))') ||
              { echo "expected a successful CI run from main"; exit 1; }
            # The run API reports a short ref name even for a tag. Verify
            # that main actually contains the selected commit.
            revision=$(gh api "repos/$GITHUB_REPOSITORY/compare/$candidate...main" |
              jq -er --arg candidate "$candidate" '
                .merge_base_commit.sha | select(. == $candidate)') ||
              { echo "selected commit is outside main's history"; exit 1; }
          fi
          echo "CI run $RUN_ID, commit $revision" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "verified_revision=$revision" >> "$GITHUB_OUTPUT"
      # A commit that passed is not tested again by the nightly run (a marker
      # in the Actions cache, saved by the last job). By hand it always runs.
      - id: done
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v6
        with:
          path: .e2e-passed
          key: e2e-passed-${{ steps.pick.outputs.verified_revision }}
          lookup-only: true
      - if: steps.done.outputs.cache-hit == 'true'
        run: echo "commit already passed, nothing to do" | tee -a "$GITHUB_STEP_SUMMARY"

  # The broken build of each emulated chip: it cannot reach Flight Control and
  # is rolled back (sdkconfig.broken). Kept for a day only.
  broken:
    name: broken firmware (${{ matrix.chip }}${{ matrix.profile == 'secure' && ', secure' || '' }})
    needs: source
    if: needs.source.outputs.skip != 'true'
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1.1
    strategy:
      fail-fast: false
      matrix:
        chip: [esp32c5, esp32s3, esp32c6]
        profile: [plain, secure]
    env:
      VARIANT: ${{ matrix.profile == 'secure' && 'secure-' || '' }}broken
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.verified_revision }}
      - run: git config --global --add safe.directory '*'
      - run: third_party/fetch-wamr.sh
      # The CI's cache of compiled objects (saved from main by ci.yml).
      - uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-${{ matrix.chip }}-${{ matrix.profile }}-${{ needs.source.outputs.verified_revision }}
          restore-keys: ccache-${{ matrix.chip }}-${{ matrix.profile }}-
      # Secure: security version 1, as the release (anti-rollback).
      - name: build
        env:
          SHA: ${{ needs.source.outputs.verified_revision }}
          SECURE_VERSION: ${{ matrix.profile == 'secure' && '1' || '' }}
        shell: bash # ${SHA::7}: the container's sh is dash
        run: port/espidf/build-ci.sh ${{ matrix.chip }} "ci-${SHA::7}" "$VARIANT"
      # The app alone, as it comes over the air (secure: unsigned).
      - uses: actions/upload-artifact@v7
        with:
          name: broken-${{ matrix.chip }}${{ matrix.profile == 'secure' && '-secure' || '' }}
          path: port/espidf/build-${{ matrix.chip }}-${{ env.VARIANT }}/flightctl_mcu_fw.bin
          retention-days: 1

  # The test builds that crash on purpose 30 s after power-on, for what the
  # status says of a crash (tests/e2e/fatal-emu.sh): a fault, an abort() and
  # the interrupt watchdog, with the ELF to decode them against. On the S3
  # (Xtensa) and the C5 (RISC-V), whose panic handlers differ.
  faulttest:
    name: crash test firmware (${{ matrix.chip }})
    needs: source
    if: needs.source.outputs.skip != 'true'
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1.1
    strategy:
      fail-fast: false
      matrix:
        chip: [esp32s3, esp32c5]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.verified_revision }}
      - run: git config --global --add safe.directory '*'
      - run: third_party/fetch-wamr.sh
      - uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-${{ matrix.chip }}-plain-${{ needs.source.outputs.verified_revision }}
          restore-keys: ccache-${{ matrix.chip }}-plain-
      - name: build
        env:
          SHA: ${{ needs.source.outputs.verified_revision }}
        shell: bash
        run: |
          for v in faulttest faulttest-aborttest faulttest-iwdttest; do
            port/espidf/build-ci.sh ${{ matrix.chip }} "ci-${SHA::7}" "$v"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: faulttest-${{ matrix.chip }}
          path: |
            port/espidf/build-${{ matrix.chip }}-faulttest*/merged-binary.bin
            port/espidf/build-${{ matrix.chip }}-faulttest*/flightctl_mcu_fw.elf
          retention-days: 1

  host:
    name: end-to-end (simulated device vs Flight Control on kind)
    needs: source
    if: needs.source.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.verified_revision }}
      - name: tools
        run: |
          kind version && helm version --short && kubectl version --client
          sudo curl -fsSL -o /usr/local/bin/flightctl \
            https://github.com/flightctl/flightctl/releases/download/$FLIGHTCTL_VERSION/flightctl-linux-amd64
          sudo chmod +x /usr/local/bin/flightctl
          # PyYAML comes with the runner: install it only if that changes.
          python3 -c 'import yaml' || { sudo apt-get update && sudo apt-get install -y python3-yaml; }
      - uses: oras-project/setup-oras@v2
      - uses: sigstore/cosign-installer@v4.1.3 # e2e checks that cosign accepts our signatures
      - name: host agent and WASM apps from the CI run (not rebuilt)
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ needs.source.outputs.run-id }}
          github-token: ${{ github.token }}
          name: host-agent
          path: build/host
      - uses: actions/download-artifact@v8
        with:
          run-id: ${{ needs.source.outputs.run-id }}
          github-token: ${{ github.token }}
          name: wasm-apps
          path: wasm-apps/build
      - run: chmod +x build/host/fc-host-agent
      - name: e2e
        run: PREBUILT_APPS=1 tests/e2e/e2e.sh
      - name: cluster state on failure
        if: failure()
        run: |
          kubectl get pods -A || true
          kubectl get events -n flightctl --sort-by=.lastTimestamp | tail -40 || true

  zephyr:
    name: end-to-end (Zephyr on ${{ matrix.kind == 'qemu' && 'an emulated Arm Cortex-M3' || 'native_sim' }} vs Flight Control on kind)
    needs: source
    if: needs.source.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { kind: zephyr, artifact: zephyr-native-sim, dir: port/zephyr/build-native_sim_native_64/zephyr }
          - { kind: qemu, artifact: zephyr-mps2-an385, dir: port/zephyr/build-mps2_an385/zephyr }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.verified_revision }}
      - name: tools
        run: |
          kind version && helm version --short && kubectl version --client
          sudo curl -fsSL -o /usr/local/bin/flightctl \
            https://github.com/flightctl/flightctl/releases/download/$FLIGHTCTL_VERSION/flightctl-linux-amd64
          sudo chmod +x /usr/local/bin/flightctl
          python3 -c 'import yaml' || { sudo apt-get update && sudo apt-get install -y python3-yaml; }
          if [[ "${{ matrix.kind }}" == qemu ]]; then sudo apt-get update && sudo apt-get install -y qemu-system-arm; fi
      - uses: oras-project/setup-oras@v2
      - name: Zephyr build and WASM apps from the CI run (not rebuilt)
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ needs.source.outputs.run-id }}
          github-token: ${{ github.token }}
          name: ${{ matrix.artifact }}
          path: ${{ matrix.dir }}
      - uses: actions/download-artifact@v8
        with:
          run-id: ${{ needs.source.outputs.run-id }}
          github-token: ${{ github.token }}
          name: wasm-apps
          path: wasm-apps/build
      - run: chmod +x ${{ matrix.dir }}/zephyr.exe
        if: matrix.kind == 'zephyr'
      # With the waits for a certificate to expire: the Zephyr build reboots
      # under its new identity.
      - name: e2e
        run: PREBUILT_APPS=1 DEVICE_KIND=${{ matrix.kind }} tests/e2e/e2e.sh
      - name: cluster state on failure
        if: failure()
        run: |
          kubectl get pods -A || true
          kubectl get events -n flightctl --sort-by=.lastTimestamp | tail -40 || true

  emulator:
    name: end-to-end on an emulated ${{ matrix.chip }}${{ matrix.secure == 1 && ', secure' || '' }} (esp-emu)
    needs: [source, broken, faulttest]
    if: needs.source.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        # The supported chips esp-emu runs (not the classic ESP32).
        chip: [esp32c5, esp32s3, esp32c6]
        secure: [0, 1]
    steps:
      - name: tools
        run: |
          sudo curl -fsSL -o /usr/local/bin/flightctl \
            https://github.com/flightctl/flightctl/releases/download/$FLIGHTCTL_VERSION/flightctl-linux-amd64
          sudo chmod +x /usr/local/bin/flightctl
          # PyYAML comes with the runner: install it only if that changes.
          python3 -c 'import yaml' || { sudo apt-get update && sudo apt-get install -y python3-yaml; }
          # NVS partition generator for provisioning (else the ESP-IDF image is pulled)
          pip install esp-idf-nvs-partition-gen==0.3.0
          # espsecure: the secure test signs a firmware with a key the chip does not know
          pip install esptool==5.6.0
          # detools: the release is pushed with a delta from the debug build
          # (the version tools/fw-push.py pins).
          # It has C extensions: the Python headers only if pip needs them.
          pip install detools==0.53.1 ||
            { sudo apt-get update && sudo apt-get install -y python3-dev && pip install detools==0.53.1; }
      - uses: oras-project/setup-oras@v2
      - name: esp-emu (checksum verified)
        run: |
          cd /tmp
          base=https://github.com/espressif/esp-emulator/releases/download/v$ESP_EMU_VERSION
          name=esp-emu-$ESP_EMU_VERSION-x86_64-unknown-linux-gnu
          curl -fsSLO "$base/$name.tar.gz" && curl -fsSLO "$base/SHA256SUMS"
          grep " $name.tar.gz\$" SHA256SUMS | sha256sum -c -
          tar xzf "$name.tar.gz" && sudo install -m 755 "$name/esp-emu" /usr/local/bin/esp-emu
          esp-emu --version
      - name: esp_prov's dependencies (the plain run provisions WiFi in the field)
        if: matrix.secure == 0
        run: pip install protobuf cryptography
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.verified_revision }}
      - name: firmware from the CI run (not rebuilt)
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ needs.source.outputs.run-id }}
          github-token: ${{ github.token }}
          name: firmware-${{ matrix.chip }}${{ matrix.secure == 1 && '-secure' || '' }}
          path: port/espidf
      - name: broken build (this workflow's)
        uses: actions/download-artifact@v8
        with:
          name: broken-${{ matrix.chip }}${{ matrix.secure == 1 && '-secure' || '' }}
          path: port/espidf/build-${{ matrix.chip }}-${{ matrix.secure == 1 && 'secure-' || '' }}broken
      # The other variant's release, which the device must refuse (a secure
      # device gets the plain one signed with its own key).
      - name: the other variant's build too
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ needs.source.outputs.run-id }}
          github-token: ${{ github.token }}
          name: firmware-${{ matrix.chip }}${{ matrix.secure == 0 && '-secure' || '' }}
          path: port/espidf
      - name: WASM apps from the CI run (not rebuilt)
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ needs.source.outputs.run-id }}
          github-token: ${{ github.token }}
          name: wasm-apps
          path: wasm-apps/build
      - name: e2e on the emulator
        env:
          ESP_PROV_LOCAL: 1
          # Certificate renewal with 2-minute certificates in one job only: the
          # agent's code is the same on every chip, the host and Zephyr runs
          # test it too, and short certificates make a slow step fail the
          # whole run. The plain C5: the fastest of the emulated chips.
          CERT: ${{ matrix.chip == 'esp32c5' && matrix.secure == 0 && 1 || 0 }}
        run: PREBUILT=1 SECURE=${{ matrix.secure }} CHIP=${{ matrix.chip }} tests/e2e/e2e-emu.sh
      # The plain C6 job already has a kind cluster, registry and emulator.
      # Boot the C3 once on that runner for the calibrated ADC and SBS scenario.
      - name: ESP32-C3 firmware for the battery test
        if: matrix.chip == 'esp32c6' && matrix.secure == 0
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ needs.source.outputs.run-id }}
          github-token: ${{ github.token }}
          name: firmware-esp32c3
          path: port/espidf
      - name: C3 battery telemetry on esp-emu (ADC and Smart Battery)
        if: matrix.chip == 'esp32c6' && matrix.secure == 0
        run: |
          parts="esp-emu-$ESP_EMU_VERSION-examples"
          (
            cd /tmp
            curl -fsSLO "https://github.com/espressif/esp-emulator/releases/download/v$ESP_EMU_VERSION/$parts.tar.gz"
            grep -F " $parts.tar.gz" SHA256SUMS | sha256sum -c -
            tar xzf "$parts.tar.gz" "$parts/analog/potentiometer.wasm"
          )
          source tools/local-ip.sh
          python3 tests/espidf-hw/battery.py port/espidf/build-esp32c3/merged-binary.bin \
            "/tmp/$parts/analog/potentiometer.wasm" --host-ip "$(local_ip)"
      # Then, against the same cluster, what the status says of a crash: the
      # plain S3 and C5 only (the handlers are per architecture, the secure
      # variant changes nothing in them).
      - name: crash builds (this workflow's)
        if: matrix.secure == 0 && (matrix.chip == 'esp32s3' || matrix.chip == 'esp32c5')
        uses: actions/download-artifact@v8
        with:
          name: faulttest-${{ matrix.chip }}
          path: port/espidf
      - name: a crash, a fault, an abort() and the interrupt watchdog (fatal-emu.sh)
        if: matrix.secure == 0 && (matrix.chip == 'esp32s3' || matrix.chip == 'esp32c5')
        run: |
          # addr2line comes from the ESP-IDF image
          docker pull -q espressif/idf:v6.1.1
          for mode in fault abort iwdt; do
            PREBUILT=1 CHIP=${{ matrix.chip }} MODE=$mode tests/e2e/fatal-emu.sh
          done
      - name: logs on failure
        if: failure()
        run: |
          tail -80 build/e2e-emu/emu.log || true
          kubectl get pods -A || true
      - name: the whole emulator log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: emu-log-${{ matrix.chip }}-${{ matrix.secure }}
          path: build/e2e-emu/emu.log
          if-no-files-found: ignore

  passed:
    name: mark the commit as passed
    needs: [source, broken, faulttest, host, zephyr, emulator]
    if: github.ref == 'refs/heads/main'
    cache-mode: write-only
    runs-on: ubuntu-latest
    steps:
      - run: mkdir .e2e-passed && touch .e2e-passed/passed
      - uses: actions/cache/save@v6
        with:
          path: .e2e-passed
          key: e2e-passed-${{ needs.source.outputs.verified_revision }}
