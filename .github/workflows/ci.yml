name: ci

# Builds and quick tests, all in parallel: firmware for every chip, host agent
# and WASM apps, the Zephyr builds, unit tests, field provisioning and a quick
# fuzzing pass. The end-to-end tests are e2e.yml, which tests these builds:
# nightly, by hand, or from here by re-running the "e2e" job, skipped on the
# first attempt. Long fuzzing runs nightly (fuzz-nightly.yml).

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the running workflow pointless.
# A re-run (the e2e job) is a group of its own: it neither cancels a newer
# push's run nor is cancelled by it.
concurrency:
  group: ci-${{ github.ref }}${{ github.run_attempt > 1 && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

env:
  ESP_EMU_VERSION: 1.2.0

jobs:
  build:
    name: host agent, WASM apps
    runs-on: ubuntu-latest
    # Zephyr's build image, as for the Zephyr job: it has clang and lld (WASM
    # apps, fuzzers), ninja and PyYAML, so nothing is installed here. (The
    # runners' apt mirror was unreachable for hours once, and every job that
    # installed a package failed.)
    container: ghcr.io/zephyrproject-rtos/ci-base:v0.30.0
    steps:
      - uses: actions/checkout@v7
      - run: git config --global --add safe.directory '*'
      - name: clang and lld on the PATH
        run: echo "$(dirname "$(ls /usr/lib/llvm-*/bin/clang | tail -1)")" >> "$GITHUB_PATH"
      - uses: ./.github/actions/mbedtls
        id: mbedtls
      - run: third_party/fetch-wamr.sh
      - name: WASM apps (alarm v1 and v2, trend, battery, sampler and localalarm v1)
        run: |
          export PATH="$(dirname "$(ls /usr/lib/llvm-*/bin/wasm-ld | tail -1)"):$PATH"
          ALARM_SOLID_DEMO=1 NO_PUSH=1 wasm-apps/build.sh alarm v1
          NO_PUSH=1 wasm-apps/build.sh alarm v2
          NO_PUSH=1 wasm-apps/build.sh trend v1
          NO_PUSH=1 wasm-apps/build.sh battery v1
          NO_PUSH=1 wasm-apps/build.sh sampler v1
          NO_PUSH=1 wasm-apps/build.sh localalarm v1
      - name: host agent
        run: MBEDTLS_DIR=${{ steps.mbedtls.outputs.dir }} port/host/build-ci.sh
      - uses: actions/upload-artifact@v7
        with:
          name: wasm-apps
          path: wasm-apps/build/*/*.wasm
      - uses: actions/upload-artifact@v7
        with:
          name: host-agent
          path: build/host/fc-host-agent

  tests:
    name: unit tests, field provisioning, quick fuzzing
    runs-on: ubuntu-latest
    container: ghcr.io/zephyrproject-rtos/ci-base:v0.30.0
    steps:
      - uses: actions/checkout@v7
      - run: git config --global --add safe.directory '*'
      - name: clang and lld on the PATH
        run: echo "$(dirname "$(ls /usr/lib/llvm-*/bin/clang | tail -1)")" >> "$GITHUB_PATH"
      - uses: ./.github/actions/mbedtls
        id: mbedtls
      - run: third_party/fetch-wamr.sh
      - name: host agent (the provisioning test runs its fc-prov-host)
        run: MBEDTLS_DIR=${{ steps.mbedtls.outputs.dir }} port/host/build-ci.sh
      - name: Zephyr's field provisioning against esp_prov
        run: tests/e2e/prov-host.sh
      - name: unit tests (C with sanitizers, Python)
        run: CC=clang tests/unit.sh -DMbedTLS_DIR=${{ steps.mbedtls.outputs.dir }}
      # Last, so a finding does not hide the tests above. Starts from the
      # corpus of the nightly runs (read only here).
      - uses: actions/cache/restore@v6
        with:
          path: build/fuzz/corpus_*
          key: fuzz-corpus-
          restore-keys: fuzz-corpus-
      - name: fuzzing, 30 seconds per target
        run: FUZZ_SECONDS=30 CC=clang tests/fuzz.sh -DMbedTLS_DIR=${{ steps.mbedtls.outputs.dir }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-findings
          path: build/fuzz/findings/

  # Every chip, uploaded for the e2e workflow (and kept 90 days): plain and
  # secure for the chips it emulates (secure: Secure Boot v2 + flash and NVS
  # encryption, unsigned: see port/espidf/build-ci.sh).
  esp-idf:
    name: firmware (${{ matrix.target }}${{ matrix.profile != 'plain' && format(', {0}', matrix.profile) || '' }})
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1.1
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: esp32c5, profile: plain }
          - { target: esp32c5, profile: secure }
          - { target: esp32s3, profile: plain }
          - { target: esp32s3, profile: secure }
          - { target: esp32c6, profile: plain }
          - { target: esp32c6, profile: secure }
          - { target: esp32, profile: plain }
          - { target: esp32c3, profile: plain }
    steps:
      - uses: actions/checkout@v7
      - run: git config --global --add safe.directory '*'
      - run: third_party/fetch-wamr.sh
      - uses: ./.github/actions/firmware
        with:
          target: ${{ matrix.target }}
          profile: ${{ matrix.profile }}
      - name: App hardware with virtual peripherals
        if: (matrix.target == 'esp32s3' || matrix.target == 'esp32c3') && matrix.profile == 'plain'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          . "$IDF_PATH/export.sh" >/dev/null
          export CCACHE_DIR="$PWD/.ccache" IDF_CCACHE_ENABLE=1 CCACHE_COMPILERCHECK=content
          cd tests/espidf-hw
          idf.py -D IDF_TARGET="$TARGET" build merge-bin
          fixture=s3
          if [[ "$TARGET" == esp32c3 ]]; then fixture=adc; fi
          ./run-ci.sh "$fixture" build/merged-binary.bin

  nuttx:
    name: NuttX (${{ matrix.board }}, MCUboot)
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.3
    strategy:
      fail-fast: false
      matrix:
        board: [esp32s3-n4r2, esp32s3-n8r8, esp32s3-n16r8, nucleo-f767zi-eth, nrf7002dk, pico2w]
    env:
      BOARD: ${{ matrix.board }}
    steps:
      - uses: actions/checkout@v7
      - name: Install NuttX build tools
        shell: bash
        run: |
          packages=(kconfig-frontends genromfs xxd)
          if [[ "$BOARD" != esp32s3-* ]]; then
            packages+=(gcc-arm-none-eabi)
          fi
          apt-get update
          apt-get install -y --no-install-recommends "${packages[@]}"
      - name: Build firmware and check the MCUboot images
        shell: bash
        run: |
          . "$IDF_PATH/export.sh" >/dev/null
          python -m pip install imgtool==2.2.0
          export NUTTX_WORK="$PWD/build/nuttx-ci"
          images="$NUTTX_WORK/nuttx"
          artifact="$PWD/build/nuttx-artifact"
          mkdir -p "$artifact"
          if [[ "$BOARD" == esp32s3-* ]]; then
            OTA=1 port/nuttx/build.sh
            test -s "$images/mcuboot-esp32s3.bin"
            test -s "$images/nuttx-ota.bin"
            cp "$images"/{mcuboot-esp32s3.bin,nuttx-ota.bin} "$artifact/"
          else
            port/nuttx/build.sh
            export MCUBOOT_SIGNING_KEY="$RUNNER_TEMP/$BOARD-ci.pem"
            imgtool keygen -k "$MCUBOOT_SIGNING_KEY" -t ecdsa-p256
            port/nuttx/sign-arm.sh "$BOARD" "$images/nuttx.bin"
            imgtool verify -k "$MCUBOOT_SIGNING_KEY" "$images/nuttx.ota.bin"
            mkdir -p "$artifact/ci-signed"
            cp "$images"/{nuttx.ota.bin,nuttx.confirmed.bin} "$artifact/ci-signed/"
          fi
          cp "$images/nuttx.bin" "$artifact/"
          cp "$images/nuttx" "$artifact/nuttx.elf"
      - name: Build the nRF5340 network core
        if: matrix.board == 'nrf7002dk'
        shell: bash
        run: |
          export NUTTX_WORK="$PWD/build/nuttx-ci-net"
          BOARD=nrf7002dk-net port/nuttx/build.sh
          mkdir -p build/nuttx-artifact/network-core
          cp "$NUTTX_WORK/nuttx/nuttx.bin" build/nuttx-artifact/network-core/
          cp "$NUTTX_WORK/nuttx/nuttx" build/nuttx-artifact/network-core/nuttx.elf
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-nuttx-${{ matrix.board }}
          path: build/nuttx-artifact/
          if-no-files-found: error
          retention-days: 90

  zephyr:
    name: Zephyr (${{ matrix.label || format('{0}, MCUboot', matrix.profile) }})
    runs-on: ubuntu-latest
    container: ghcr.io/zephyrproject-rtos/ci-base:v0.30.0
    strategy:
      fail-fast: false
      matrix:
        include:
          - { profile: native_sim, board: native_sim/native/64, label: native_sim, artifact: zephyr-native-sim }
          - { profile: qemu, board: mps2/an385, sdk: arm, label: 'mps2/an385, Arm Cortex-M3 on Ethernet', artifact: zephyr-mps2-an385 }
          - { profile: esp32s3, board: esp32s3_devkitc/esp32s3/procpu, sdk: xtensa, label: 'ESP32-S3, with MCUboot' }
          - { profile: nucleo-f767zi-eth, board: nucleo_f767zi, sdk: arm }
          - { profile: nrf7002dk, board: nrf7002dk/nrf5340/cpuapp, sdk: arm }
          - { profile: pico2w, board: rpi_pico2/rp2350a/m33_0/w/mcuboot, sdk: arm }
    env:
      BOARD: ${{ matrix.board }}
      PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v7
      - run: git config --global --add safe.directory '*'
      - run: third_party/fetch-wamr.sh
      # Only native_sim saves the common tree. Each board fetches its extra HALs.
      - uses: actions/cache/restore@v6
        id: workspace
        with:
          path: third_party/zephyr-ws
          key: zephyr-ws-${{ hashFiles('third_party/fetch-zephyr.sh', 'third_party/patches/zephyr-*.patch') }}
      - run: third_party/fetch-zephyr.sh
      - uses: actions/cache/save@v6
        if: matrix.profile == 'native_sim' && steps.workspace.outputs.cache-hit != 'true'
        with:
          path: third_party/zephyr-ws
          key: ${{ steps.workspace.outputs.cache-primary-key }}
      - uses: actions/cache@v6
        if: matrix.sdk
        with:
          path: third_party/zephyr-sdk
          key: zephyr-sdk-${{ matrix.sdk }}-${{ hashFiles('third_party/fetch-zephyr-sdk.sh') }}
      - name: Fetch toolchain and WiFi firmware
        if: matrix.sdk
        env:
          ZEPHYR_SDK_TOOLCHAINS: ${{ matrix.sdk == 'xtensa' && 'xtensa-espressif_esp32s3_zephyr-elf' || 'arm-zephyr-eabi' }}
        run: third_party/fetch-zephyr-sdk.sh
      - name: Build firmware
        env:
          BUILD_DIR: build-ci
        run: |
          if [ "$PROFILE" = pico2w ]; then
            port/zephyr/build.sh -- -Dzephyr_SNIPPET=cdc-acm-console
          else
            port/zephyr/build.sh
          fi
      - name: App hardware (GPIO, ADC, PWM, I2C, SPI, UART)
        if: matrix.profile == 'native_sim'
        run: tests/zephyr-hw.sh
      - name: Install QEMU
        if: matrix.profile == 'qemu'
        run: apt-get update && apt-get install -y qemu-system-arm
      - name: Apps' C library
        if: matrix.profile == 'native_sim' || matrix.profile == 'qemu'
        run: tests/zephyr-apps.sh
      - name: WASM GPIO by devicetree name and fleet alias
        if: matrix.profile == 'esp32s3'
        shell: bash
        run: |
          root="$PWD"
          cd third_party/zephyr-ws
          export ZEPHYR_SDK_INSTALL_DIR="$root/third_party/zephyr-sdk"
          west build -b "$BOARD" -d "$root/build/button-s3" "$root/tests/zephyr-apps"
          cd "$root"
          tests/espidf-hw/run-ci.sh zephyr build/button-s3/zephyr/zephyr.bin
      - name: Collect build artifacts
        shell: bash
        run: |
          artifact="$PWD/build/zephyr-artifact"
          mkdir -p "$artifact"
          cd port/zephyr/build-ci
          case "$PROFILE" in
            native_sim) cp zephyr/zephyr.exe "$artifact/" ;;
            qemu) cp zephyr/zephyr.bin "$artifact/" ;;
            esp32s3)
              cp --parents mcuboot/zephyr/zephyr.bin zephyr/zephyr/zephyr.{bin,signed.bin,elf} "$artifact/"
              ;;
            *)
              cp --parents mcuboot/zephyr/zephyr.{bin,hex} \
                zephyr/zephyr/zephyr.{bin,elf,signed.bin,signed.confirmed.bin,signed.confirmed.hex} "$artifact/"
              if [[ "$PROFILE" == nrf7002dk ]]; then
                cp --parents hci_ipc/zephyr/zephyr.{hex,elf} "$artifact/"
              fi
              ;;
          esac
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact || format('firmware-zephyr-{0}', matrix.profile) }}
          path: build/zephyr-artifact/
          if-no-files-found: error
          retention-days: 90

  # The end-to-end tests on this run's builds: skipped on the first attempt,
  # run by re-running this job once everything else has passed.
  e2e:
    needs: [build, tests, esp-idf, nuttx, zephyr]
    if: github.run_attempt > 1
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/e2e.yml
    with:
      run-id: ${{ github.run_id }}
