name: ci

# Stage 1 (parallel): firmware for every chip; host agent, WASM apps and a
# quick fuzzing pass in one job; the Zephyr build. Stage 2: the end-to-end
# tests, which reuse what stage 1 built instead of building it again. Long fuzzing runs nightly
# (fuzz-nightly.yml).

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  workflow_dispatch:

# A newer push to the same branch makes the running workflow pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MBEDTLS_VERSION: v4.1.1
  FLIGHTCTL_VERSION: v1.4.0
  ESP_EMU_VERSION: 0.51.0

jobs:
  build:
    name: host agent, WASM apps, unit tests, quick fuzzing
    runs-on: ubuntu-latest
    # Zephyr's build image, as for the Zephyr job: it has clang and lld (WASM
    # apps, fuzzers), ninja and PyYAML, so nothing is installed here. (The
    # runners' apt mirror was unreachable for hours once, and every job that
    # installed a package failed.)
    container: ghcr.io/zephyrproject-rtos/ci-base:v0.30.0
    steps:
      - uses: actions/checkout@v7
      - run: git config --global --add safe.directory '*'
      - name: clang and lld on the PATH
        run: echo "$(dirname "$(ls /usr/lib/llvm-*/bin/clang | tail -1)")" >> "$GITHUB_PATH"
      - uses: ./.github/actions/mbedtls
        id: mbedtls
        with:
          version: ${{ env.MBEDTLS_VERSION }}
      - run: third_party/fetch-wamr.sh && third_party/fetch-detools.sh
      - name: WASM apps (alarm v1 and v2, trend v1)
        run: |
          export PATH="$(dirname "$(ls /usr/lib/llvm-*/bin/wasm-ld | tail -1)"):$PATH"
          NO_PUSH=1 wasm-apps/build.sh alarm v1
          NO_PUSH=1 wasm-apps/build.sh alarm v2
          NO_PUSH=1 wasm-apps/build.sh trend v1
      - name: host agent
        run: MBEDTLS_DIR=${{ steps.mbedtls.outputs.dir }} port/host/build-ci.sh
      - uses: actions/upload-artifact@v7
        with:
          name: wasm-apps
          path: wasm-apps/build/*/*.wasm
      - uses: actions/upload-artifact@v7
        with:
          name: host-agent
          path: build/host/fc-host-agent
      # After the artifacts above: a failure here does not stop the jobs that need them.
      - name: Zephyr's field provisioning against esp_prov
        run: tests/e2e/prov-host.sh
      - name: unit tests (C with sanitizers, Python)
        run: CC=clang tests/unit.sh -DMbedTLS_DIR=${{ steps.mbedtls.outputs.dir }}
      # Last, so a finding does not stop the artifacts above. Starts from the
      # corpus of the nightly runs (read only here).
      - uses: actions/cache/restore@v6
        with:
          path: build/fuzz/corpus_*
          key: fuzz-corpus-
          restore-keys: fuzz-corpus-
      - name: fuzzing, 30 seconds per target
        run: FUZZ_SECONDS=30 CC=clang tests/fuzz.sh -DMbedTLS_DIR=${{ steps.mbedtls.outputs.dir }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-findings
          path: build/fuzz/crash-*

  firmware:
    name: firmware (${{ matrix.target }}${{ matrix.profile == 'secure' && ', secure' || '' }})
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.3
    env:
      # Build variants and directories of the profile: secure, secure-release, build-<chip>-secure
      V: ${{ matrix.profile == 'secure' && 'secure' || '' }}
      P: ${{ matrix.profile == 'secure' && 'secure-' || '' }}
      S: ${{ matrix.profile == 'secure' && '-secure' || '' }}
    strategy:
      fail-fast: false
      matrix:
        target: [esp32, esp32s2, esp32s3, esp32c3, esp32c5, esp32c6]
        profile: [plain]
        # Secure Boot v2 + flash encryption + NVS encryption, for the emulated
        # chips (signed with a throwaway key, see port/espidf/build-ci.sh).
        include:
          - { target: esp32c3, profile: secure }
          - { target: esp32c5, profile: secure }
    steps:
      - uses: actions/checkout@v7
      - run: git config --global --add safe.directory '*'
      - run: third_party/fetch-wamr.sh && third_party/fetch-detools.sh
      - uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-${{ matrix.target }}-${{ matrix.profile }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.target }}-${{ matrix.profile }}-
      - name: debug build
        shell: bash
        run: port/espidf/build-ci.sh ${{ matrix.target }} ci-${GITHUB_SHA::7} ${{ env.V }}
      # Secure profile: security version 1 (anti-rollback), so the device
      # refuses the debug build (0) once it has confirmed the release.
      - name: release profile (-Os)
        shell: bash
        env:
          SECURE_VERSION: ${{ matrix.profile == 'secure' && '1' || '' }}
        run: port/espidf/build-ci.sh ${{ matrix.target }} ci-${GITHUB_SHA::7} ${{ env.P }}release
      - name: broken build, for the rollback test (emulated chips only)
        if: contains(fromJSON('["esp32c3", "esp32c5"]'), matrix.target)
        shell: bash
        env:
          SECURE_VERSION: ${{ matrix.profile == 'secure' && '1' || '' }}
        run: port/espidf/build-ci.sh ${{ matrix.target }} ci-${GITHUB_SHA::7} ${{ env.P }}broken
      - name: ble variant, for the BLE field provisioning test (C3)
        if: matrix.target == 'esp32c3' && matrix.profile == 'plain'
        shell: bash
        run: port/espidf/build-ci.sh ${{ matrix.target }} ci-${GITHUB_SHA::7} ble
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.target }}${{ env.S }}
          path: |
            port/espidf/build-${{ matrix.target }}${{ env.S }}/flightctl_mcu_fw.bin
            port/espidf/build-${{ matrix.target }}${{ env.S }}/merged-binary.bin
            port/espidf/build-${{ matrix.target }}-${{ env.P }}release/flightctl_mcu_fw.bin
            port/espidf/build-${{ matrix.target }}-${{ env.P }}release/flightctl_mcu_fw-unsigned.bin
            port/espidf/build-${{ matrix.target }}-${{ env.P }}release/merged-binary.bin
            port/espidf/build-${{ matrix.target }}-${{ env.P }}broken/flightctl_mcu_fw.bin
            port/espidf/build-${{ matrix.target }}-ble/flightctl_mcu_fw.bin
            port/espidf/build-${{ matrix.target }}-ble/flightctl_mcu_fw.elf
            port/espidf/build-${{ matrix.target }}-ble/merged-binary.bin

  zephyr:
    name: Zephyr (native_sim)
    runs-on: ubuntu-latest
    # Zephyr's own build image: west, CMake, the host compiler native_sim uses.
    container: ghcr.io/zephyrproject-rtos/ci-base:v0.30.0
    steps:
      - uses: actions/checkout@v7
      - run: git config --global --add safe.directory '*'
      - run: third_party/fetch-wamr.sh && third_party/fetch-detools.sh
      # The Zephyr tree (about 900 MB) changes only with the pinned version.
      - uses: actions/cache@v6
        with:
          path: third_party/zephyr-ws
          key: zephyr-ws-${{ hashFiles('third_party/fetch-zephyr.sh') }}
      - run: third_party/fetch-zephyr.sh
      - name: build
        run: port/zephyr/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: zephyr-native-sim
          path: port/zephyr/build-native_sim_native_64/zephyr/zephyr.exe

  e2e-zephyr:
    name: end-to-end (Zephyr on native_sim vs Flight Control on kind)
    needs: [zephyr, build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: tools
        run: |
          kind version && helm version --short && kubectl version --client
          sudo curl -fsSL -o /usr/local/bin/flightctl \
            https://github.com/flightctl/flightctl/releases/download/$FLIGHTCTL_VERSION/flightctl-linux-amd64
          sudo chmod +x /usr/local/bin/flightctl
          # PyYAML comes with the runner: install it only if that changes.
          python3 -c 'import yaml' || { sudo apt-get update && sudo apt-get install -y python3-yaml; }
      - uses: oras-project/setup-oras@v2
      - name: Zephyr build from the Zephyr job (not rebuilt)
        uses: actions/download-artifact@v8
        with:
          name: zephyr-native-sim
          path: port/zephyr/build-native_sim_native_64/zephyr
      - run: chmod +x port/zephyr/build-native_sim_native_64/zephyr/zephyr.exe
      - name: WASM apps from the WASM job (not rebuilt)
        uses: actions/download-artifact@v8
        with:
          name: wasm-apps
          path: wasm-apps/build
      # The test of the simulated device, with the Zephyr build as the device.
      - name: e2e
        run: PREBUILT_APPS=1 DEVICE_KIND=zephyr tests/e2e/e2e.sh
      - name: cluster state on failure
        if: failure()
        run: |
          kubectl get pods -A || true
          kubectl get events -n flightctl --sort-by=.lastTimestamp | tail -40 || true

  e2e:
    name: end-to-end (simulated device vs Flight Control on kind)
    needs: [build]
    # Runs even when the quick fuzzing found something: the artifacts are there.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: tools
        run: |
          kind version && helm version --short && kubectl version --client
          sudo curl -fsSL -o /usr/local/bin/flightctl \
            https://github.com/flightctl/flightctl/releases/download/$FLIGHTCTL_VERSION/flightctl-linux-amd64
          sudo chmod +x /usr/local/bin/flightctl
          # PyYAML comes with the runner: install it only if that changes.
          python3 -c 'import yaml' || { sudo apt-get update && sudo apt-get install -y python3-yaml; }
      - uses: oras-project/setup-oras@v2
      - uses: sigstore/cosign-installer@v4.1.3 # e2e checks that cosign accepts our signatures
      - name: host agent from the host job (not rebuilt)
        uses: actions/download-artifact@v8
        with:
          name: host-agent
          path: build/host
      - run: chmod +x build/host/fc-host-agent
      - name: WASM apps from the WASM job (not rebuilt)
        uses: actions/download-artifact@v8
        with:
          name: wasm-apps
          path: wasm-apps/build
      - name: e2e
        run: PREBUILT_APPS=1 tests/e2e/e2e.sh
      - name: cluster state on failure
        if: failure()
        run: |
          kubectl get pods -A || true
          kubectl get events -n flightctl --sort-by=.lastTimestamp | tail -40 || true

  emulator:
    name: end-to-end on an emulated ${{ matrix.chip }}${{ matrix.secure == 1 && ', secure' || '' }}${{ matrix.prov == 'ble' && ', BLE provisioning' || '' }} (esp-emu)
    needs: [firmware, build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        chip: [esp32c3, esp32c5]
        secure: [0, 1]
        prov: [softap]
        # an extra job, not a change to the plain C3 one: prov differs
        include:
          - { chip: esp32c3, secure: 0, prov: ble }
    steps:
      - uses: actions/checkout@v7
      - name: tools
        run: |
          sudo curl -fsSL -o /usr/local/bin/flightctl \
            https://github.com/flightctl/flightctl/releases/download/$FLIGHTCTL_VERSION/flightctl-linux-amd64
          sudo chmod +x /usr/local/bin/flightctl
          # PyYAML comes with the runner: install it only if that changes.
          python3 -c 'import yaml' || { sudo apt-get update && sudo apt-get install -y python3-yaml; }
          # NVS partition generator for provisioning (else the ESP-IDF image is pulled)
          pip install esp-idf-nvs-partition-gen==0.3.0
          # espsecure: the secure test signs a firmware with a key the chip does not know
          pip install esptool==5.3.1
          # detools: the release is pushed with a delta from the debug build
          # (the version third_party/fetch-detools.sh fetches for the device).
          # It has C extensions: the Python headers only if pip needs them.
          pip install detools==0.53.1 ||
            { sudo apt-get update && sudo apt-get install -y python3-dev && pip install detools==0.53.1; }
      - uses: oras-project/setup-oras@v2
      - name: esp-emu (checksum verified)
        run: |
          cd /tmp
          base=https://github.com/espressif/esp-emulator/releases/download/v$ESP_EMU_VERSION
          name=esp-emu-$ESP_EMU_VERSION-x86_64-unknown-linux-gnu
          curl -fsSLO "$base/$name.tar.gz" && curl -fsSLO "$base/SHA256SUMS"
          grep " $name.tar.gz\$" SHA256SUMS | sha256sum -c -
          tar xzf "$name.tar.gz" && sudo install -m 755 "$name/esp-emu" /usr/local/bin/esp-emu
          esp-emu --version
      - name: firmware from the firmware job (not rebuilt)
        uses: actions/download-artifact@v8
        with:
          name: firmware-${{ matrix.chip }}${{ matrix.secure == 1 && '-secure' || '' }}
          path: port/espidf
      - name: secure build too, which a plain device must refuse
        if: matrix.secure == 0
        uses: actions/download-artifact@v8
        with:
          name: firmware-${{ matrix.chip }}-secure
          path: port/espidf
      - name: WASM apps from the WASM job (not rebuilt)
        uses: actions/download-artifact@v8
        with:
          name: wasm-apps
          path: wasm-apps/build
      - name: esp_prov's dependencies (the plain run provisions WiFi in the field)
        if: matrix.secure == 0
        run: pip install protobuf cryptography ${{ matrix.prov == 'ble' && 'bumble' || '' }}
      - name: e2e on the emulator
        env:
          ESP_PROV_LOCAL: 1
        run: PREBUILT=1 SECURE=${{ matrix.secure }} CHIP=${{ matrix.chip }} PROV=${{ matrix.prov }} tests/e2e/e2e-emu.sh
      - name: logs on failure
        if: failure()
        run: |
          tail -80 build/e2e-emu/emu.log || true
          kubectl get pods -A || true
