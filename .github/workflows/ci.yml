name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  host:
    name: host agent (Linux)
    runs-on: ubuntu-latest
    # The IDF image has cmake, ninja, gcc and the same mbedTLS 3.6 the firmware uses.
    container: espressif/idf:v5.5.6
    steps:
      - uses: actions/checkout@v4
      - run: third_party/fetch-wamr.sh
      - shell: bash
        run: ci/build-host.sh

  firmware:
    name: firmware (${{ matrix.target }})
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.6
    strategy:
      fail-fast: false
      matrix:
        target: [esp32, esp32s2, esp32s3, esp32c3, esp32c5, esp32c6]
    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory '*'
      - run: third_party/fetch-wamr.sh
      - name: debug build
        shell: bash
        run: ci/build-firmware.sh ${{ matrix.target }} ci-${GITHUB_SHA::7}
      - name: release profile (-Os)
        shell: bash
        run: ci/build-firmware.sh ${{ matrix.target }} ci-${GITHUB_SHA::7} release
      - name: broken build (for the rollback test)
        shell: bash
        run: ci/build-firmware.sh ${{ matrix.target }} ci-${GITHUB_SHA::7} broken
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.target }}
          path: |
            firmware/build-${{ matrix.target }}/flightctl_mcu_fw.bin
            firmware/build-${{ matrix.target }}/merged-binary.bin
            firmware/build-${{ matrix.target }}-release/flightctl_mcu_fw.bin
            firmware/build-${{ matrix.target }}-release/merged-binary.bin
            firmware/build-${{ matrix.target }}-broken/flightctl_mcu_fw.bin

  wasm:
    name: WASM apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: build alarm v1 and v2
        run: |
          export PATH="$(dirname "$(ls /usr/lib/llvm-*/bin/wasm-ld | tail -1)"):$PATH"
          NO_PUSH=1 wasm-apps/build.sh alarm v1
          NO_PUSH=1 wasm-apps/build.sh alarm v2
          NO_PUSH=1 wasm-apps/build.sh trend v1
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-apps
          path: wasm-apps/build/*/*.wasm

  fuzz:
    name: fuzzing (HTTP, OCI, agent)
    runs-on: ubuntu-latest
    env:
      MBEDTLS_VERSION: v3.6.7
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang ninja-build
      - name: mbedTLS 3.6
        run: |
          git clone --depth 1 --branch $MBEDTLS_VERSION --recurse-submodules --shallow-submodules \
            https://github.com/Mbed-TLS/mbedtls /tmp/mbedtls-src
          cmake -S /tmp/mbedtls-src -B /tmp/mbedtls -G Ninja -DENABLE_TESTING=OFF -DENABLE_PROGRAMS=OFF \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/tmp/mbedtls-install
          cmake --build /tmp/mbedtls --target install
      - name: fuzz, 2 minutes per target
        run: |
          third_party/fetch-wamr.sh
          FUZZ_SECONDS=120 CC=clang ci/fuzz.sh -DMbedTLS_DIR=/tmp/mbedtls-install/lib/cmake/MbedTLS
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-findings
          path: build/fuzz/crash-*

  e2e:
    name: end-to-end (simulated device vs Flight Control on kind)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FLIGHTCTL_VERSION: v1.3.1
      MBEDTLS_VERSION: v3.6.7
    steps:
      - uses: actions/checkout@v4
      - name: tools
        run: |
          kind version && helm version --short && kubectl version --client
          sudo curl -fsSL -o /usr/local/bin/flightctl \
            https://github.com/flightctl/flightctl/releases/download/$FLIGHTCTL_VERSION/flightctl-linux-amd64
          sudo chmod +x /usr/local/bin/flightctl
          sudo apt-get update && sudo apt-get install -y clang lld ninja-build python3-yaml
          echo "$(dirname "$(ls /usr/lib/llvm-*/bin/wasm-ld | tail -1)")" >> "$GITHUB_PATH"
      - uses: oras-project/setup-oras@v1
      - uses: sigstore/cosign-installer@v3 # e2e checks that cosign accepts our signatures
      - name: mbedTLS 3.6
        run: |
          git clone --depth 1 --branch $MBEDTLS_VERSION --recurse-submodules --shallow-submodules \
            https://github.com/Mbed-TLS/mbedtls /tmp/mbedtls-src
          cmake -S /tmp/mbedtls-src -B /tmp/mbedtls -G Ninja -DENABLE_TESTING=OFF -DENABLE_PROGRAMS=OFF \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/tmp/mbedtls-install
          cmake --build /tmp/mbedtls --target install
      - name: host agent
        run: |
          third_party/fetch-wamr.sh
          cmake -S . -B build/host -G Ninja -DMbedTLS_DIR=/tmp/mbedtls-install/lib/cmake/MbedTLS
          cmake --build build/host
      - name: e2e
        run: ci/e2e.sh
      - name: cluster state on failure
        if: failure()
        run: |
          kubectl get pods -A || true
          kubectl get events -n flightctl --sort-by=.lastTimestamp | tail -40 || true

  emulator:
    name: end-to-end on an emulated ${{ matrix.chip }} (esp-emu)
    needs: firmware
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        chip: [esp32c3, esp32c5]
    env:
      FLIGHTCTL_VERSION: v1.3.1
      ESP_EMU_VERSION: 0.51.0
    steps:
      - uses: actions/checkout@v4
      - name: tools
        run: |
          sudo curl -fsSL -o /usr/local/bin/flightctl \
            https://github.com/flightctl/flightctl/releases/download/$FLIGHTCTL_VERSION/flightctl-linux-amd64
          sudo chmod +x /usr/local/bin/flightctl
          sudo apt-get update && sudo apt-get install -y clang lld python3-yaml
          echo "$(dirname "$(ls /usr/lib/llvm-*/bin/wasm-ld | tail -1)")" >> "$GITHUB_PATH"
      - uses: oras-project/setup-oras@v1
      - name: esp-emu (checksum verified)
        run: |
          cd /tmp
          base=https://github.com/espressif/esp-emulator/releases/download/v$ESP_EMU_VERSION
          name=esp-emu-$ESP_EMU_VERSION-x86_64-unknown-linux-gnu
          curl -fsSLO "$base/$name.tar.gz" && curl -fsSLO "$base/SHA256SUMS"
          grep " $name.tar.gz\$" SHA256SUMS | sha256sum -c -
          tar xzf "$name.tar.gz" && sudo install -m 755 "$name/esp-emu" /usr/local/bin/esp-emu
          esp-emu --version
      - name: firmware from the firmware job (not rebuilt)
        uses: actions/download-artifact@v4
        with:
          name: firmware-${{ matrix.chip }}
          path: firmware
      - run: docker pull espressif/idf:v5.5.6 # nvs_partition_gen, for provisioning
      - name: e2e on the emulator
        run: PREBUILT=1 CHIP=${{ matrix.chip }} ci/e2e-emu.sh
      - name: logs on failure
        if: failure()
        run: |
          tail -80 build/e2e-emu/emu.log || true
          kubectl get pods -A || true
