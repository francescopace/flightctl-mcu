name: ci

# Stage 1 (parallel): firmware for every chip; host agent, WASM apps and a
# quick fuzzing pass in one job. Stage 2: the end-to-end tests, which reuse
# what stage 1 built instead of building it again. Long fuzzing runs nightly
# (fuzz-nightly.yml).

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  workflow_dispatch:

# A newer push to the same branch makes the running workflow pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MBEDTLS_VERSION: v3.6.7
  FLIGHTCTL_VERSION: v1.3.1
  ESP_EMU_VERSION: 0.51.0

jobs:
  build:
    name: host agent, WASM apps, unit tests, quick fuzzing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mbedtls
        id: mbedtls
        with:
          version: ${{ env.MBEDTLS_VERSION }}
      # clang + lld: WASM apps and the fuzzers; ninja: host agent and fuzzers.
      - run: sudo apt-get update && sudo apt-get install -y clang lld ninja-build python3-yaml
      - run: third_party/fetch-wamr.sh
      - name: WASM apps (alarm v1 and v2, trend v1)
        run: |
          export PATH="$(dirname "$(ls /usr/lib/llvm-*/bin/wasm-ld | tail -1)"):$PATH"
          NO_PUSH=1 wasm-apps/build.sh alarm v1
          NO_PUSH=1 wasm-apps/build.sh alarm v2
          NO_PUSH=1 wasm-apps/build.sh trend v1
      - name: host agent
        run: MBEDTLS_DIR=${{ steps.mbedtls.outputs.dir }} ci/build-host.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-apps
          path: wasm-apps/build/*/*.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: host-agent
          path: build/host/fc-host-agent
      - name: unit tests (C with sanitizers, Python)
        run: CC=clang ci/unit.sh -DMbedTLS_DIR=${{ steps.mbedtls.outputs.dir }}
      # Last, so a finding does not stop the artifacts above. Starts from the
      # corpus of the nightly runs (read only here).
      - uses: actions/cache/restore@v4
        with:
          path: build/fuzz/corpus_*
          key: fuzz-corpus-
          restore-keys: fuzz-corpus-
      - name: fuzzing, 30 seconds per target
        run: FUZZ_SECONDS=30 CC=clang ci/fuzz.sh -DMbedTLS_DIR=${{ steps.mbedtls.outputs.dir }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-findings
          path: build/fuzz/crash-*

  firmware:
    name: firmware (${{ matrix.target }}${{ matrix.profile == 'secure' && ', secure' || '' }})
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.6
    env:
      # Build variants and directories of the profile: secure, secure-release, build-<chip>-secure
      V: ${{ matrix.profile == 'secure' && 'secure' || '' }}
      P: ${{ matrix.profile == 'secure' && 'secure-' || '' }}
      S: ${{ matrix.profile == 'secure' && '-secure' || '' }}
    strategy:
      fail-fast: false
      matrix:
        target: [esp32, esp32s2, esp32s3, esp32c3, esp32c5, esp32c6]
        profile: [plain]
        # Secure Boot v2 + flash encryption + NVS encryption, for the emulated
        # chips (signed with a throwaway key, see ci/build-firmware.sh).
        include:
          - { target: esp32c3, profile: secure }
          - { target: esp32c5, profile: secure }
    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory '*'
      - run: third_party/fetch-wamr.sh
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.target }}-${{ matrix.profile }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.target }}-${{ matrix.profile }}-
      - name: debug build
        shell: bash
        run: ci/build-firmware.sh ${{ matrix.target }} ci-${GITHUB_SHA::7} ${{ env.V }}
      - name: release profile (-Os)
        shell: bash
        run: ci/build-firmware.sh ${{ matrix.target }} ci-${GITHUB_SHA::7} ${{ env.P }}release
      - name: broken build, for the rollback test (emulated chips only)
        if: contains(fromJSON('["esp32c3", "esp32c5"]'), matrix.target)
        shell: bash
        run: ci/build-firmware.sh ${{ matrix.target }} ci-${GITHUB_SHA::7} ${{ env.P }}broken
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.target }}${{ env.S }}
          path: |
            firmware/build-${{ matrix.target }}${{ env.S }}/flightctl_mcu_fw.bin
            firmware/build-${{ matrix.target }}${{ env.S }}/merged-binary.bin
            firmware/build-${{ matrix.target }}-${{ env.P }}release/flightctl_mcu_fw.bin
            firmware/build-${{ matrix.target }}-${{ env.P }}release/flightctl_mcu_fw-unsigned.bin
            firmware/build-${{ matrix.target }}-${{ env.P }}release/merged-binary.bin
            firmware/build-${{ matrix.target }}-${{ env.P }}broken/flightctl_mcu_fw.bin

  e2e:
    name: end-to-end (simulated device vs Flight Control on kind)
    needs: [build]
    # Runs even when the quick fuzzing found something: the artifacts are there.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: tools
        run: |
          kind version && helm version --short && kubectl version --client
          sudo curl -fsSL -o /usr/local/bin/flightctl \
            https://github.com/flightctl/flightctl/releases/download/$FLIGHTCTL_VERSION/flightctl-linux-amd64
          sudo chmod +x /usr/local/bin/flightctl
          sudo apt-get update && sudo apt-get install -y python3-yaml
      - uses: oras-project/setup-oras@v1
      - uses: sigstore/cosign-installer@v3 # e2e checks that cosign accepts our signatures
      - name: host agent from the host job (not rebuilt)
        uses: actions/download-artifact@v4
        with:
          name: host-agent
          path: build/host
      - run: chmod +x build/host/fc-host-agent
      - name: WASM apps from the WASM job (not rebuilt)
        uses: actions/download-artifact@v4
        with:
          name: wasm-apps
          path: wasm-apps/build
      - name: e2e
        run: PREBUILT_APPS=1 ci/e2e.sh
      - name: cluster state on failure
        if: failure()
        run: |
          kubectl get pods -A || true
          kubectl get events -n flightctl --sort-by=.lastTimestamp | tail -40 || true

  emulator:
    name: end-to-end on an emulated ${{ matrix.chip }}${{ matrix.secure == 1 && ', secure' || '' }} (esp-emu)
    needs: [firmware, build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        chip: [esp32c3, esp32c5]
        secure: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - name: tools
        run: |
          sudo curl -fsSL -o /usr/local/bin/flightctl \
            https://github.com/flightctl/flightctl/releases/download/$FLIGHTCTL_VERSION/flightctl-linux-amd64
          sudo chmod +x /usr/local/bin/flightctl
          sudo apt-get update && sudo apt-get install -y python3-yaml
          # NVS partition generator for provisioning (else the ESP-IDF image is pulled)
          pip install esp-idf-nvs-partition-gen==0.1.9
          # espsecure: the secure test signs a firmware with a key the chip does not know
          pip install esptool==5.1.0
      - uses: oras-project/setup-oras@v1
      - name: esp-emu (checksum verified)
        run: |
          cd /tmp
          base=https://github.com/espressif/esp-emulator/releases/download/v$ESP_EMU_VERSION
          name=esp-emu-$ESP_EMU_VERSION-x86_64-unknown-linux-gnu
          curl -fsSLO "$base/$name.tar.gz" && curl -fsSLO "$base/SHA256SUMS"
          grep " $name.tar.gz\$" SHA256SUMS | sha256sum -c -
          tar xzf "$name.tar.gz" && sudo install -m 755 "$name/esp-emu" /usr/local/bin/esp-emu
          esp-emu --version
      - name: firmware from the firmware job (not rebuilt)
        uses: actions/download-artifact@v4
        with:
          name: firmware-${{ matrix.chip }}${{ matrix.secure == 1 && '-secure' || '' }}
          path: firmware
      - name: secure build too, which a plain device must refuse
        if: matrix.secure == 0
        uses: actions/download-artifact@v4
        with:
          name: firmware-${{ matrix.chip }}-secure
          path: firmware
      - name: WASM apps from the WASM job (not rebuilt)
        uses: actions/download-artifact@v4
        with:
          name: wasm-apps
          path: wasm-apps/build
      - name: e2e on the emulator
        run: PREBUILT=1 SECURE=${{ matrix.secure }} CHIP=${{ matrix.chip }} ci/e2e-emu.sh
      - name: logs on failure
        if: failure()
        run: |
          tail -80 build/e2e-emu/emu.log || true
          kubectl get pods -A || true
