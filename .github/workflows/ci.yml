name: ci

# Builds and quick tests, all in parallel: firmware for every chip, host agent
# and WASM apps, the Zephyr builds, unit tests, field provisioning and a quick
# fuzzing pass. The end-to-end tests are e2e.yml, which tests these builds:
# nightly, by hand, or from here by re-running the "e2e" job, skipped on the
# first attempt. Long fuzzing runs nightly (fuzz-nightly.yml).

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  workflow_dispatch:

# A newer push to the same branch makes the running workflow pointless.
# A re-run (the e2e job) is a group of its own: it neither cancels a newer
# push's run nor is cancelled by it.
concurrency:
  group: ci-${{ github.ref }}${{ github.run_attempt > 1 && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

env:
  ESP_EMU_VERSION: 1.1.0

jobs:
  build:
    name: host agent, WASM apps
    runs-on: ubuntu-latest
    # Zephyr's build image, as for the Zephyr job: it has clang and lld (WASM
    # apps, fuzzers), ninja and PyYAML, so nothing is installed here. (The
    # runners' apt mirror was unreachable for hours once, and every job that
    # installed a package failed.)
    container: ghcr.io/zephyrproject-rtos/ci-base:v0.30.0
    steps:
      - uses: actions/checkout@v7
      - run: git config --global --add safe.directory '*'
      - name: clang and lld on the PATH
        run: echo "$(dirname "$(ls /usr/lib/llvm-*/bin/clang | tail -1)")" >> "$GITHUB_PATH"
      - uses: ./.github/actions/mbedtls
        id: mbedtls
      - run: third_party/fetch-wamr.sh
      - name: WASM apps (alarm v1 and v2, trend, battery and sampler v1)
        run: |
          export PATH="$(dirname "$(ls /usr/lib/llvm-*/bin/wasm-ld | tail -1)"):$PATH"
          ALARM_SOLID_DEMO=1 NO_PUSH=1 wasm-apps/build.sh alarm v1
          NO_PUSH=1 wasm-apps/build.sh alarm v2
          NO_PUSH=1 wasm-apps/build.sh trend v1
          NO_PUSH=1 wasm-apps/build.sh battery v1
          NO_PUSH=1 wasm-apps/build.sh sampler v1
      - name: host agent
        run: MBEDTLS_DIR=${{ steps.mbedtls.outputs.dir }} port/host/build-ci.sh
      - uses: actions/upload-artifact@v7
        with:
          name: wasm-apps
          path: wasm-apps/build/*/*.wasm
      - uses: actions/upload-artifact@v7
        with:
          name: host-agent
          path: build/host/fc-host-agent

  tests:
    name: unit tests, field provisioning, quick fuzzing
    runs-on: ubuntu-latest
    container: ghcr.io/zephyrproject-rtos/ci-base:v0.30.0
    steps:
      - uses: actions/checkout@v7
      - run: git config --global --add safe.directory '*'
      - name: clang and lld on the PATH
        run: echo "$(dirname "$(ls /usr/lib/llvm-*/bin/clang | tail -1)")" >> "$GITHUB_PATH"
      - uses: ./.github/actions/mbedtls
        id: mbedtls
      - run: third_party/fetch-wamr.sh
      - name: host agent (the provisioning test runs its fc-prov-host)
        run: MBEDTLS_DIR=${{ steps.mbedtls.outputs.dir }} port/host/build-ci.sh
      - name: Zephyr's field provisioning against esp_prov
        run: tests/e2e/prov-host.sh
      - name: unit tests (C with sanitizers, Python)
        run: CC=clang tests/unit.sh -DMbedTLS_DIR=${{ steps.mbedtls.outputs.dir }}
      # Last, so a finding does not hide the tests above. Starts from the
      # corpus of the nightly runs (read only here).
      - uses: actions/cache/restore@v6
        with:
          path: build/fuzz/corpus_*
          key: fuzz-corpus-
          restore-keys: fuzz-corpus-
      - name: fuzzing, 30 seconds per target
        run: FUZZ_SECONDS=30 CC=clang tests/fuzz.sh -DMbedTLS_DIR=${{ steps.mbedtls.outputs.dir }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-findings
          path: build/fuzz/findings/

  # Every chip, uploaded for the e2e workflow (and kept 90 days): plain and
  # secure for the chips it emulates (secure: Secure Boot v2 + flash and NVS
  # encryption, unsigned: see port/espidf/build-ci.sh).
  firmware:
    name: firmware (${{ matrix.target }}${{ matrix.profile != 'plain' && format(', {0}', matrix.profile) || '' }})
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1.1
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: esp32c5, profile: plain }
          - { target: esp32c5, profile: secure }
          - { target: esp32s3, profile: plain }
          - { target: esp32s3, profile: secure }
          - { target: esp32c6, profile: plain }
          - { target: esp32c6, profile: secure }
          - { target: esp32, profile: plain }
          - { target: esp32c3, profile: plain }
    steps:
      - uses: actions/checkout@v7
      - run: git config --global --add safe.directory '*'
      - run: third_party/fetch-wamr.sh
      - uses: ./.github/actions/firmware
        with:
          target: ${{ matrix.target }}
          profile: ${{ matrix.profile }}
      - name: App hardware with virtual peripherals
        if: (matrix.target == 'esp32s3' || matrix.target == 'esp32c3') && matrix.profile == 'plain'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          . "$IDF_PATH/export.sh" >/dev/null
          export CCACHE_DIR="$PWD/.ccache" IDF_CCACHE_ENABLE=1 CCACHE_COMPILERCHECK=content
          cd tests/espidf-hw
          idf.py -D IDF_TARGET="$TARGET" build merge-bin
          fixture=s3
          if [[ "$TARGET" == esp32c3 ]]; then fixture=adc; fi
          ./run-ci.sh "$fixture" build/merged-binary.bin

  zephyr:
    name: Zephyr (native_sim)
    runs-on: ubuntu-latest
    # Zephyr's own build image: west, CMake, the host compiler native_sim uses.
    container: ghcr.io/zephyrproject-rtos/ci-base:v0.30.0
    steps:
      - uses: actions/checkout@v7
      - run: git config --global --add safe.directory '*'
      - run: third_party/fetch-wamr.sh
      # The Zephyr tree (about 900 MB) changes only with the pinned version.
      - uses: actions/cache@v6
        with:
          path: third_party/zephyr-ws
          key: zephyr-ws-${{ hashFiles('third_party/fetch-zephyr.sh', 'third_party/patches/zephyr-*.patch') }}
      - run: third_party/fetch-zephyr.sh
      - name: build
        run: port/zephyr/build.sh
      # The port's hardware for apps on native_sim's emulated drivers.
      - name: app hardware (GPIO, ADC, PWM, I2C, SPI, UART)
        run: tests/zephyr-hw.sh
      # The apps' C library with Zephyr's picolibc.
      - name: apps' C library
        run: tests/zephyr-apps.sh
      - uses: actions/upload-artifact@v7
        with:
          name: zephyr-native-sim
          path: port/zephyr/build-native_sim_native_64/zephyr/zephyr.exe

  zephyr-qemu:
    name: Zephyr (mps2/an385, Arm Cortex-M3 on Ethernet)
    runs-on: ubuntu-latest
    container: ghcr.io/zephyrproject-rtos/ci-base:v0.30.0
    steps:
      - uses: actions/checkout@v7
      - run: git config --global --add safe.directory '*'
      - run: third_party/fetch-wamr.sh
      - uses: actions/cache@v6
        with:
          path: third_party/zephyr-ws
          key: zephyr-ws-${{ hashFiles('third_party/fetch-zephyr.sh', 'third_party/patches/zephyr-*.patch') }}
      - run: third_party/fetch-zephyr.sh
      # The Arm toolchain alone (about 2 GB), kept between runs.
      - uses: actions/cache@v6
        with:
          path: third_party/zephyr-sdk
          key: zephyr-sdk-arm-${{ hashFiles('third_party/fetch-zephyr-sdk.sh') }}
      - run: ZEPHYR_SDK_TOOLCHAINS=arm-zephyr-eabi third_party/fetch-zephyr-sdk.sh
      - name: build
        run: BOARD=mps2/an385 port/zephyr/build.sh
      # The apps' C library on the Cortex-M3, in QEMU: %f through WAMR's
      # invokeNative for Thumb, and the stack of the app's 8 KB thread.
      - name: apps' C library
        run: |
          apt-get update && apt-get install -y qemu-system-arm
          BOARD=mps2/an385 tests/zephyr-apps.sh
      - uses: actions/upload-artifact@v7
        with:
          name: zephyr-mps2-an385
          path: port/zephyr/build-mps2_an385/zephyr/zephyr.bin

  zephyr-esp32s3:
    name: Zephyr (ESP32-S3, with MCUboot)
    runs-on: ubuntu-latest
    container: ghcr.io/zephyrproject-rtos/ci-base:v0.30.0
    steps:
      - uses: actions/checkout@v7
      - run: git config --global --add safe.directory '*'
      - run: third_party/fetch-wamr.sh
      - uses: actions/cache@v6
        with:
          path: third_party/zephyr-ws
          key: zephyr-ws-${{ hashFiles('third_party/fetch-zephyr.sh', 'third_party/patches/zephyr-*.patch') }}
      - run: third_party/fetch-zephyr.sh
      # The Xtensa toolchain alone, kept between runs; the script also fetches
      # Espressif's WiFi blobs into the Zephyr tree.
      - uses: actions/cache@v6
        with:
          path: third_party/zephyr-sdk
          key: zephyr-sdk-xtensa-${{ hashFiles('third_party/fetch-zephyr-sdk.sh') }}
      - run: ZEPHYR_SDK_TOOLCHAINS=xtensa-espressif_esp32s3_zephyr-elf third_party/fetch-zephyr-sdk.sh
      # Signed with a key made for this run: the build is checked, not released.
      - name: build
        run: BOARD=esp32s3_devkitc/esp32s3/procpu BUILD_DIR=build-esp32s3 port/zephyr/build.sh
      - name: WASM GPIO by devicetree name and fleet alias
        shell: bash
        run: |
          root="$PWD"
          cd third_party/zephyr-ws
          export ZEPHYR_SDK_INSTALL_DIR="$root/third_party/zephyr-sdk"
          west build -b esp32s3_devkitc/esp32s3/procpu -d "$root/build/button-s3" "$root/tests/zephyr-apps"
          cd "$root"
          tests/espidf-hw/run-ci.sh zephyr build/button-s3/zephyr/zephyr.bin

  # The end-to-end tests on this run's builds: skipped on the first attempt,
  # run by re-running this job once everything else has passed.
  e2e:
    needs: [build, tests, firmware, zephyr, zephyr-qemu, zephyr-esp32s3]
    if: github.run_attempt > 1
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/e2e.yml
    with:
      run-id: ${{ github.run_id }}
