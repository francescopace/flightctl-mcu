# On the 4 MiB Mini, share internal SRAM between the Wi-Fi driver and agent.
CONFIG_ESP32_WIFI_EXTRA_IRAM_OPT=n
CONFIG_ESP32_WIFI_SLP_IRAM_OPT=n
CONFIG_ESP32_WIFI_MGMT_SBUF_NUM=6
CONFIG_ESP32_WIFI_RX_BA_WIN=4
CONFIG_HEAP_MEM_POOL_SIZE=69632
CONFIG_FC_FW_PLATFORM="esp32c5-mini"
CONFIG_ESP32_WIFI_STA_POWER_SAVE_NONE=y
CONFIG_NET_BUF_DATA_SIZE=192
CONFIG_NET_BUF_TX_COUNT=24
CONFIG_FC_ESP_INTERNAL_HEAPS=y
# POSIX app threads inherit the main priority. Share CPU time with the
# Espressif Wi-Fi worker at the lowest of 15 preemptible priorities.
CONFIG_MAIN_THREAD_PRIORITY=14
