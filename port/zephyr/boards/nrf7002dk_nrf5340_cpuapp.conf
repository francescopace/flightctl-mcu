CONFIG_WIFI=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_DHCPV4=y
CONFIG_WIFI_NM_WPA_SUPPLICANT_LEGACY_CRYPTO=n
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_MCUBOOT_GENERATE_CONFIRMED_IMAGE=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_SPI=y
CONFIG_SPI_NOR=y
CONFIG_FS_LITTLEFS_PROG_SIZE=256
CONFIG_FS_LITTLEFS_CACHE_SIZE=256
CONFIG_FC_FW_PLATFORM="nrf7002dk_nrf5340_cpuapp"
# The network core supplies hardware entropy over the HCI IPC transport.
CONFIG_BT=y
CONFIG_BT_OBSERVER=y
CONFIG_MBEDTLS_PSA_CRYPTO_EXTERNAL_RNG_ALLOW_NON_CSPRNG=n
CONFIG_MBEDTLS_PSA_CRYPTO_EXTERNAL_RNG=y
CONFIG_MAX_PTHREAD_MUTEX_COUNT=40
CONFIG_HEAP_MEM_POOL_SIZE=73728
CONFIG_SENSOR=y
CONFIG_ADC=y
CONFIG_PWM=y
CONFIG_I2C=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y

CONFIG_FC_LIBC_HEAP_WATERMARK=y
