# Pico 2 W with factory-provisioned Wi-Fi and the RP2350 hardware RNG.
CONFIG_WIFI=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_DHCPV4=y
# Use the same hardware identifier in BOOTSEL and the USB console.
CONFIG_HWINFO_RPI_PICO_CHIP_ID=y
CONFIG_SENSOR=y
CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_PWM=y
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
CONFIG_FS_LITTLEFS_PROG_SIZE=256
CONFIG_FS_LITTLEFS_CACHE_SIZE=256
CONFIG_HEAP_MEM_POOL_SIZE=98304
CONFIG_MAX_PTHREAD_MUTEX_COUNT=32
CONFIG_FC_FW_PLATFORM="rpi_pico2_rp2350a_m33_0_w"
