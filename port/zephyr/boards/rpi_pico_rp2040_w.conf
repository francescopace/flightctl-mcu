# Raspberry Pi Pico W: RP2040 (Cortex-M0+, 264 KB of RAM, 2 MB of flash) and
# a CYW43439 for WiFi. Also read for the board started by MCUboot
# (rpi_pico/rp2040/w/mcuboot, which adds rpi_pico_rp2040_w_mcuboot.conf).
CONFIG_WIFI=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_DHCPV4=y
# No field provisioning (src/wifi.c) on this board: Infineon's driver in
# Zephyr 4.5 cannot open an access point on the CYW43439 (docs/ZEPHYR.md).

# Randomness. The RP2040 has no random generator and Zephyr no entropy driver
# for it: the port has one, on the chip's ring oscillator
# (CONFIG_FC_ENTROPY_RP2_ROSC, on by default with the overlay's node). PSA
# (TLS, the device key) and the rest of Zephyr (TCP sequence numbers, DNS
# query ids) seed their generators from it.

# Zephyr says what a fatal error was before the port restarts the board
# (fc_port_zephyr.c); the minimal log only costs its messages.
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_LOG_DEFAULT_LEVEL=1
# The Cortex-M0+ has no memory protection: a marker at the end of each stack
# is checked instead, so that an overflow is reported, not suffered.
CONFIG_STACK_SENTINEL=y
CONFIG_THREAD_NAME=y

# LittleFS writes whole flash pages (256 bytes). Zephyr 4.3 dropped writes
# of less than a page on this chip (docs/ZEPHYR.md); 4.5 does them, and this
# stays as it was tried.
CONFIG_FS_LITTLEFS_PROG_SIZE=256
CONFIG_FS_LITTLEFS_CACHE_SIZE=256

# Memory. Measured on the board (customInfo stackMinFreeBytes and the log
# line before a firmware update's restart, z19 and z20): the status thread
# uses 3.8 KB of stack; the spec loop, on the main thread after its start-up,
# 9.2 KB when it downloads firmware over TLS, 9.1 KB when it installs an app,
# 4.6 KB when it only polls. The main thread gets 14 KB, the status thread
# 8 KB (a certificate renewal runs there, not measured), instead of the
# ESP-IDF builds' 24 KB and 12 KB.
CONFIG_FC_AGENT_STACK_SIZE=8192
CONFIG_MAIN_STACK_SIZE=14336
# What is left of the 264 KB after 114 KB of static data (with the console
# on USB and the log; mbedTLS's threading layer and its POSIX mutexes took
# 2 KB from the C heap, the app interface's board map, handles and event
# queues 5 KB more): the kernel heap, which thread stacks come from (the
# status thread, an app thread of 8 KB) after the WiFi driver and USB
# have taken 14 KB of it; and the C heap.
CONFIG_HEAP_MEM_POOL_SIZE=39936
CONFIG_FC_HEAP_SIZE=105472
