# ESP32-S3-DevKitC (board esp32s3_devkitc/esp32s3/procpu): Xtensa LX7, 512 KB
# of RAM, 8 MB of flash, WiFi in the chip. Built with sysbuild
# (port/zephyr/build.sh does it), which is how Zephyr starts this board: MCUboot,
# then the application, signed, in the first slot.

CONFIG_WIFI=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_DHCPV4=y
# Where several access points carry the network: the strongest, not the
# first one heard. And back by itself after a drop.
CONFIG_ESP32_WIFI_STA_SCAN_ALL=y
CONFIG_ESP32_WIFI_STA_RECONNECT=y
# Field provisioning (src/wifi.c): an access point and a station at once, so
# that the network an installer gives is tried with the access point still up;
# the access point gives installers an address.
# WIFI_USAGE_MODE_STA_AP, not ESP32_WIFI_AP_STA_MODE alone: it also lets the
# WiFi network manager keep both interfaces, without which the access point's
# is taken for the station's and installers get no address.
CONFIG_WIFI_NM=y
CONFIG_WIFI_USAGE_MODE_STA_AP=y
CONFIG_NET_IF_MAX_IPV4_COUNT=2
CONFIG_NET_DHCPV4_SERVER=y
# The thread that serves it: Zephyr's 2.4 KB is too little on Xtensa, and its
# AP+STA sample gives it 4 KB.
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=4096
# No ICMP probe of an address before it is offered (1 s per lease): the
# access point's network has only installers on it.
CONFIG_NET_DHCPV4_SERVER_ICMP_PROBE_TIMEOUT=0

# Firmware updates into the second slot.
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y

# Zephyr says what a fatal error was before the port restarts the board
# (fc_port_zephyr.c); the minimal log only costs its messages.
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_LOG_DEFAULT_LEVEL=1
CONFIG_THREAD_NAME=y

# Memory. Zephyr gives this chip's first core 372 KB of its RAM for data. The
# agent's threads get 16 KB of stack each instead of the core's 24 KB (they
# use 4.2 KB on the Pico W; Xtensa's register windows take more). The kernel
# heap is 96 KB: the WiFi driver takes 37 KB of it, and thread stacks come
# from the rest (the two agent threads, an app thread of 8 KB). The C heap,
# 123 KB instead of the default 160 KB, makes room for it and for the app
# interface's board map, handles and event queues (5 KB).
CONFIG_FC_AGENT_STACK_SIZE=16384
CONFIG_HEAP_MEM_POOL_SIZE=98304
CONFIG_FC_HEAP_SIZE=125952
