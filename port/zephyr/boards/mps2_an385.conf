# Arm MPS2 AN385 (Cortex-M3) in QEMU: an Arm microcontroller on Ethernet,
# run in CI (port/zephyr/run-qemu.sh). QEMU's user network gives the address
# (DHCP), the DNS server and the way out to Flight Control.
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_INIT_TIMEOUT=30

# The credentials and the storage: Zephyr's flash simulator in SRAM (the
# overlay).
CONFIG_FLASH_SIMULATOR=y
CONFIG_DEBUG_COREDUMP=y
CONFIG_DEBUG_COREDUMP_BACKEND_FLASH_PARTITION=y
CONFIG_DEBUG_COREDUMP_MEMORY_DUMP_THREADS=y

# The emulated board has no random generator. Not for a real device: the
# numbers are not secret.
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_TIMER_RANDOM_GENERATOR=y

# The memory of a microcontroller with 384 KB of SRAM, the least a device
# needs (docs/DEVICES.md), though the emulated board has more.
CONFIG_HEAP_MEM_POOL_SIZE=98304
CONFIG_FC_HEAP_SIZE=131072
