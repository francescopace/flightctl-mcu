# Station provisioning uses the network in the factory partition.
CONFIG_WIFI=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_DHCPV4=y
CONFIG_ESP32_WIFI_STA_SCAN_ALL=y
CONFIG_ESP32_WIFI_STA_RECONNECT=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_LOG_DEFAULT_LEVEL=1
CONFIG_THREAD_NAME=y
CONFIG_FC_AGENT_STACK_SIZE=12288
# Leave DMA-capable system heap for Wi-Fi traffic while a WASM app runs.
CONFIG_HEAP_MEM_POOL_SIZE=64512
CONFIG_FC_HEAP_SIZE=80896
CONFIG_MAX_PTHREAD_MUTEX_COUNT=32
CONFIG_ESP32_WIFI_STATIC_RX_BUFFER_NUM=4
CONFIG_ESP32_WIFI_DYNAMIC_RX_BUFFER_NUM=8
CONFIG_ESP32_WIFI_DYNAMIC_TX_BUFFER_NUM=8
CONFIG_NET_BUF_DATA_SIZE=192
CONFIG_NET_BUF_RX_COUNT=20
CONFIG_NET_BUF_TX_COUNT=24
CONFIG_ESP32_REGION_1_NOINIT=y
CONFIG_FC_ESP_INTERNAL_HEAPS=y
# POSIX app threads inherit the main priority. Share CPU time with the
# Espressif Wi-Fi worker at the lowest of 15 preemptible priorities.
CONFIG_MAIN_THREAD_PRIORITY=14
