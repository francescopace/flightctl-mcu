# Used only by builds with a bootloader (port/zephyr/build.sh on a board named
# .../mcuboot): MCUboot, two slots swapped with a way back, images signed
# with ECDSA P-256. The key is given by build.sh (.secrets/mcuboot-signing.pem).
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_MCUBOOT_MODE_SWAP_USING_MOVE=y
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
