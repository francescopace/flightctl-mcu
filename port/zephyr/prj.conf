# flightctl-mcu on Zephyr: what the agent core needs from the system.
# Board-specific settings are in boards/.

# The core is POSIX: threads with the stack size they ask for, clocks, sleep.
CONFIG_POSIX_API=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_ALLOC=y
CONFIG_DYNAMIC_THREAD_PREFER_ALLOC=y
CONFIG_MAIN_STACK_SIZE=16384
# POSIX mutexes come from a fixed pool (5 by default): the core takes 4, and
# mbedTLS's threading layer (include/fc-tf-psa-user.h) 7.
CONFIG_MAX_PTHREAD_MUTEX_COUNT=16
CONFIG_MAX_PTHREAD_COND_COUNT=8
CONFIG_REBOOT=y
CONFIG_HWINFO=y
# The C heap is the port's (port/zephyr/fc_heap_zephyr.c), which reports how
# much of it is free; its size is CONFIG_FC_HEAP_SIZE.
CONFIG_COMMON_LIBC_MALLOC=n
CONFIG_SYS_HEAP_RUNTIME_STATS=y
# CPU use for status.resources: cycles outside the idle threads.
CONFIG_THREAD_RUNTIME_STATS=y

# Storage: LittleFS on the fc_storage partition (port/zephyr).
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y

# Network: TCP sockets, DNS, and SNTP for the time certificates are checked
# against.
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
# One interface and the router DHCP gives: no table of static routes (new in
# Zephyr 4.5, and on by default).
CONFIG_NET_IPV4_ROUTE=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
# The agent keeps two connections to Flight Control and opens a third to the
# registry for an app or a firmware; DHCP and DNS have theirs. Zephyr's
# default of four in all refuses the third.
CONFIG_NET_MAX_CONN=10
CONFIG_NET_MAX_CONTEXTS=10
CONFIG_DNS_RESOLVER=y
# The agent's two threads may both look the server up at the same time.
CONFIG_DNS_NUM_CONCUR_QUERIES=3
CONFIG_SNTP=y

# mbedTLS 4.1, as in the other builds: TLS 1.3 with ECDSA P-256 keys, X.509
# and PKCS#10 requests. Its cryptography is PSA's (TF-PSA-Crypto), chosen
# below by what TLS 1.3 and the agent take from it. RSA only for a device key
# in hardware, which the core can make.
CONFIG_PSA_CRYPTO=y
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_SSL_PROTO_TLS1_2=y
CONFIG_MBEDTLS_SSL_PROTO_TLS1_3=y
CONFIG_MBEDTLS_SSL_TLS1_3_KEY_EXCHANGE_MODE_EPHEMERAL_ENABLED=y
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_ECDSA_ENABLED=y
CONFIG_MBEDTLS_KEY_EXCHANGE_ECDHE_RSA_ENABLED=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
# The key exchange, the signatures, HKDF, the two AEAD ciphers, the hashes.
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_ALG_DETERMINISTIC_ECDSA=y
CONFIG_PSA_WANT_ALG_HKDF=y
CONFIG_PSA_WANT_ALG_HKDF_EXTRACT=y
CONFIG_PSA_WANT_ALG_HKDF_EXPAND=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_SHA_384=y
CONFIG_PSA_WANT_ALG_GCM=y
CONFIG_PSA_WANT_ALG_CHACHA20_POLY1305=y
CONFIG_PSA_WANT_ALG_TLS12_PRF=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_ECC_SECP_R1_384=y
CONFIG_PSA_WANT_ECC_MONTGOMERY_255=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_KEY_TYPE_CHACHA20=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_DERIVE=y
CONFIG_PSA_WANT_ALG_RSA_PKCS1V15_SIGN=y
CONFIG_PSA_WANT_ALG_RSA_PSS=y
CONFIG_PSA_WANT_KEY_TYPE_RSA_PUBLIC_KEY=y
CONFIG_PSA_WANT_KEY_TYPE_RSA_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_RSA_KEY_PAIR_EXPORT=y
CONFIG_PSA_WANT_KEY_TYPE_RSA_KEY_PAIR_GENERATE=y
# PSA's random generator: mbedTLS's own (entropy gathered, then a DRBG), fed
# by Zephyr's entropy driver.
CONFIG_MBEDTLS_PSA_CRYPTO_LEGACY_RNG=y
CONFIG_MBEDTLS_CTR_DRBG_C=y
CONFIG_MBEDTLS_HMAC_DRBG_C=y
CONFIG_MBEDTLS_PEM_PARSE_C=y
CONFIG_MBEDTLS_PEM_WRITE_C=y
CONFIG_MBEDTLS_PK_PARSE_C=y
CONFIG_MBEDTLS_PK_WRITE_C=y
CONFIG_MBEDTLS_X509_CRT_PARSE_C=y
CONFIG_MBEDTLS_X509_CSR_WRITE_C=y
CONFIG_MBEDTLS_X509_CSR_PARSE_C=y
CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=y
CONFIG_MBEDTLS_HAVE_TIME_DATE=y
# A TLS connection keeps a buffer for each direction. Records from the server
# can be 16 KB; what the agent sends goes out in records of 4 KB, as in the
# ESP-IDF build: 12 KB less per connection.
CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=16384
CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=4096
# mbedTLS allocates from the C heap, like everything else here: its PSA key
# slots too (static ones cost 38 KB of RAM, sized for the largest RSA key).
CONFIG_MBEDTLS_ENABLE_HEAP=n
CONFIG_MBEDTLS_PSA_STATIC_KEY_SLOTS=n
# The AES tables in flash, not RAM (9 KB).
CONFIG_MBEDTLS_AES_ROM_TABLES=y
CONFIG_MBEDTLS_USER_CONFIG_FILE="fc-mbedtls-user.h"
CONFIG_TF_PSA_CRYPTO_USER_CONFIG_FILE="fc-tf-psa-user.h"
CONFIG_ENTROPY_GENERATOR=y
