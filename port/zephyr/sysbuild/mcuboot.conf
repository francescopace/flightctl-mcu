# Added to MCUboot's configuration by sysbuild. No downgrades: an update is
# installed only if its security counter is at least the running image's
# (images get it from SECURE_VERSION, port/zephyr/build.sh; 0 by default). It
# keeps a signed release with a known vulnerability from being put back over
# the air; it does not stop someone who can write the flash.
CONFIG_MCUBOOT_DOWNGRADE_PREVENTION=y
CONFIG_MCUBOOT_DOWNGRADE_PREVENTION_SECURITY_COUNTER=y
