# Raspberry Pi Pico W: RP2040 (Cortex-M0+, 264 KB of RAM, 2 MB of flash) and
# a CYW43439 for WiFi. Not run on a board yet: built to see what fits.
CONFIG_WIFI=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_DHCPV4=y

# NOT SAFE: Zephyr 4.3 has no entropy driver for the RP2040, which has no
# hardware random generator. Until the port has one (the ring oscillator),
# this build's keys are predictable.
CONFIG_TEST_RANDOM_GENERATOR=y

# What is left of the 264 KB after 102 KB of static data (112 KB with the
# console on USB): the kernel heap the thread stacks come from (two agent
# threads of 24 KB, an app thread of 8 KB), and the C heap.
CONFIG_HEAP_MEM_POOL_SIZE=61440
CONFIG_FC_HEAP_SIZE=94208
