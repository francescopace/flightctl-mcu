# Raspberry Pi Pico W: RP2040 (Cortex-M0+, 264 KB of RAM, 2 MB of flash) and
# a CYW43439 for WiFi. Not run on a board yet: built to see what fits.
CONFIG_WIFI=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_DHCPV4=y

# NOT SAFE: Zephyr 4.3 has no entropy driver for the RP2040, which has no
# hardware random generator. Until the port has one (the ring oscillator),
# this build's keys are predictable.
CONFIG_TEST_RANDOM_GENERATOR=y

# Zephyr says what a fatal error was before the port restarts the board
# (fc_port_zephyr.c); the minimal log only costs its messages.
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_LOG_DEFAULT_LEVEL=1
# The Cortex-M0+ has no memory protection: a marker at the end of each stack
# is checked instead, so that an overflow is reported, not suffered.
CONFIG_STACK_SENTINEL=y
CONFIG_THREAD_NAME=y

# LittleFS writes whole flash pages (256 bytes). On this board a write of
# less than a page reports success and writes nothing (Zephyr 4.3's driver
# has a path of its own for those; whole pages go through the ROM's routine,
# which works).
CONFIG_FS_LITTLEFS_PROG_SIZE=256
CONFIG_FS_LITTLEFS_CACHE_SIZE=256

# What is left of the 264 KB after 102 KB of static data (114 KB with the
# console on USB and the log): the kernel heap, which the thread stacks come
# from (two agent threads of 24 KB, an app thread of 8 KB) after the WiFi
# driver and USB have taken 14 KB of it; and the C heap.
CONFIG_HEAP_MEM_POOL_SIZE=72704
CONFIG_FC_HEAP_SIZE=82944
