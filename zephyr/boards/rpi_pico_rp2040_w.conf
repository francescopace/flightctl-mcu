# Raspberry Pi Pico W: RP2040 (Cortex-M0+, 264 KB of RAM, 2 MB of flash) and
# a CYW43439 for WiFi. Also read for the board started by MCUboot
# (rpi_pico/rp2040/w/mcuboot, which adds rpi_pico_rp2040_w_mcuboot.conf).
CONFIG_WIFI=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_DHCPV4=y

# Randomness. The RP2040 has no random generator and Zephyr 4.3 no entropy
# driver for it. TLS and the device key take their entropy from the chip's
# ring oscillator (CONFIG_FC_ENTROPY_RP2_ROSC, on by default here). The rest
# of Zephyr (TCP sequence numbers, DNS query ids) uses the test generator,
# which is predictable.
CONFIG_MBEDTLS_ENTROPY_POLL_ZEPHYR=n
CONFIG_TEST_RANDOM_GENERATOR=y

# Zephyr says what a fatal error was before the port restarts the board
# (fc_port_zephyr.c); the minimal log only costs its messages.
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_LOG_DEFAULT_LEVEL=1
# The Cortex-M0+ has no memory protection: a marker at the end of each stack
# is checked instead, so that an overflow is reported, not suffered.
CONFIG_STACK_SENTINEL=y
CONFIG_THREAD_NAME=y

# LittleFS writes whole flash pages (256 bytes). Zephyr 4.3.2 dropped writes
# of less than a page on this chip; third_party/patches fixes that, and this
# stays as it was tried.
CONFIG_FS_LITTLEFS_PROG_SIZE=256
CONFIG_FS_LITTLEFS_CACHE_SIZE=256

# Memory. Measured on the board (CONFIG_INIT_STACKS): the agent's threads
# use 4.2 KB of stack with their TLS connections up, the main thread 3 KB;
# they get 10 KB and 8 KB instead of the 24 KB and 16 KB of roomier boards.
CONFIG_FC_AGENT_STACK_SIZE=10240
CONFIG_MAIN_STACK_SIZE=8192
# What is left of the 264 KB after 106 KB of static data (with the console on
# USB and the log): the kernel heap, which thread stacks come from (the two
# agent threads, an app thread of 8 KB) after the WiFi driver and USB have
# taken 14 KB of it; and the C heap.
CONFIG_HEAP_MEM_POOL_SIZE=46080
CONFIG_FC_HEAP_SIZE=112640
