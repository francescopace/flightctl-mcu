# native_sim: the agent as a Linux process. Zephyr's kernel, POSIX layer, file
# system and mbedTLS are real; the network is the host's, through its sockets.
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_ETH_NATIVE_TAP=n
CONFIG_NET_L2_ETHERNET=n
# Seeded from the host's /dev/urandom at each start.
CONFIG_FAKE_ENTROPY_NATIVE_SIM=y
CONFIG_FAKE_ENTROPY_NATIVE_SIM_SEED_BY_DEFAULT=y
# The flash is a file (--flash=PATH): the storage and credentials survive a
# restart.
CONFIG_FLASH_SIMULATOR=y
# A 64-bit host's frames: thread stacks (from the kernel heap) and the C
# heap are sized for that, not for a microcontroller.
CONFIG_HEAP_MEM_POOL_SIZE=2097152
CONFIG_FC_HEAP_SIZE=4194304
