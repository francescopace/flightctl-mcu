# Raspberry Pi Pico W started by MCUboot (board rpi_pico/rp2040/w/mcuboot,
# built with sysbuild: zephyr/build.sh does it): firmware updates into the
# second slot. The rest of the board's configuration is
# rpi_pico_rp2040_w.conf, which sysbuild.cmake adds.
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
# The slot is erased sector by sector as the image arrives: erasing 832 KB at
# once keeps interrupts off for seconds.
CONFIG_IMG_ERASE_PROGRESSIVELY=y
# What a release's index calls this board (platform.architecture).
CONFIG_FC_FW_PLATFORM="rpi_pico_w"
# What Zephyr 4.3 gives the Pico W and forgets for this variant of it: the
# WiFi chip (the default is another one, with other firmware).
CONFIG_CYW43439=y
