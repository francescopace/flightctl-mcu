# The app runtime uses the DevKitC's octal PSRAM, as in the firmware.
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y
CONFIG_ESP_SPIRAM_HEAP_SIZE=2097152
# Zephyr allocates the WASM thread stack from the kernel heap.
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_FC_HEAP_SIZE=120112
# The fixture loads the firmware's board overlay, including its I2C bus,
# SPI bus and SPI-driven LED strip.
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_LED_STRIP=y
